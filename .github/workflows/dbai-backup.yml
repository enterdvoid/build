name: DBAI Repository Backup

on:
  workflow_dispatch:
    inputs:
      include_release_metadata:
        description: "Include metadata for existing GitHub releases (does not download firmware assets)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dbai-repository-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create, verify, and publish backup
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.DBAI_RELEASE_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      INCLUDE_RELEASE_METADATA: ${{ github.event_name != 'workflow_dispatch' || inputs.include_release_metadata }}
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Check release token and preinstalled backup tools
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Add a repository Actions secret named DBAI_RELEASE_TOKEN with repository Contents read/write permission before running backup."
            exit 1
          fi
          gh api "repos/$REPOSITORY" --jq '.full_name'
          command -v git
          command -v gh
          command -v jq
          command -v gzip
          command -v tar
          git --version
          gh --version
          jq --version

          # Test actual release-write access before spending time creating the 700+ MB backup.
          PROBE_TAG="dbai-backup-permission-probe-$GITHUB_RUN_ID"
          PROBE_RELEASE_ID=""
          cleanup_probe() {
            if [[ -n "$PROBE_RELEASE_ID" ]]; then
              gh api --method DELETE "repos/$REPOSITORY/releases/$PROBE_RELEASE_ID" >/dev/null 2>&1 || true
            fi
            gh api --method DELETE "repos/$REPOSITORY/git/refs/tags/$PROBE_TAG" >/dev/null 2>&1 || true
          }
          trap cleanup_probe EXIT
          if ! PROBE_RESPONSE="$(gh api --method POST "repos/$REPOSITORY/releases" \
            -f tag_name="$PROBE_TAG" \
            -f target_commitish="$(git rev-parse HEAD)" \
            -f name="$PROBE_TAG" \
            -F draft=true 2>&1)"; then
            echo "::error::DBAI_RELEASE_TOKEN cannot create releases in $REPOSITORY. Edit the fine-grained token so it includes repository 'build' and Contents: Read and write, then update this repository's DBAI_RELEASE_TOKEN secret."
            echo "$PROBE_RESPONSE"
            exit 1
          fi
          PROBE_RELEASE_ID="$(jq -r '.id // empty' <<< "$PROBE_RESPONSE")"
          if [[ -z "$PROBE_RELEASE_ID" ]]; then
            echo "::error::GitHub accepted the release probe but returned no release ID; refusing to start backup."
            exit 1
          fi
          gh api --method DELETE "repos/$REPOSITORY/releases/$PROBE_RELEASE_ID" >/dev/null
          PROBE_RELEASE_ID=""
          gh api --method DELETE "repos/$REPOSITORY/git/refs/tags/$PROBE_TAG" >/dev/null 2>&1 || true
          trap - EXIT

      - name: Create source snapshot, Git bundle, and metadata
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p backup-out
          COMMIT="$(git rev-parse HEAD)"
          SHORT_COMMIT="$(git rev-parse --short=12 HEAD)"
          UTC_STAMP="$(date -u +'%Y-%m-%d_%H-%M-%S')"
          TAG="dbai-backup-${UTC_STAMP}-${GITHUB_RUN_ID}"
          TITLE="DBAI Repository Backup ${UTC_STAMP}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

          git status --short
          git ls-files -z | sort -z | xargs -0 -r -n1 printf '%s\n' > backup-out/tracked-files.txt
          git archive --format=tar HEAD | gzip -1 > backup-out/dbai-source-snapshot.tar.gz
          git bundle create backup-out/dbai-git-mirror.bundle --all
          git bundle verify backup-out/dbai-git-mirror.bundle

          if [[ "$INCLUDE_RELEASE_METADATA" == "true" ]]; then
            gh api --paginate "repos/$REPOSITORY/releases?per_page=100"               --jq '.[] | {tag_name, name, draft, prerelease, created_at, published_at, html_url, assets: [.assets[]? | {name, size, digest, browser_download_url}]}'               | jq -s '.' > backup-out/release-metadata.json
          else
            printf '[]\n' > backup-out/release-metadata.json
          fi

          cat > backup-out/backup-manifest.json <<EOF
          {
            "repository": "$REPOSITORY",
            "commit": "$COMMIT",
            "short_commit": "$SHORT_COMMIT",
            "branch": "$GITHUB_REF_NAME",
            "created_utc": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "workflow_run_attempt": "$GITHUB_RUN_ATTEMPT",
            "artifacts": [
              "dbai-source-snapshot.tar.gz",
              "dbai-git-mirror.bundle",
              "release-metadata.json",
              "tracked-files.txt"
            ],
            "scope_note": "Repository source and reachable Git refs plus release metadata; not GitHub secrets, repository settings, or historical release binary assets."
          }
          EOF

          (
            cd backup-out
            sha256sum               dbai-source-snapshot.tar.gz               dbai-git-mirror.bundle               release-metadata.json               tracked-files.txt               backup-manifest.json > SHA256SUMS
            sha256sum -c SHA256SUMS
            gzip -t dbai-source-snapshot.tar.gz
            tar -tzf dbai-source-snapshot.tar.gz >/dev/null
            git bundle verify "$GITHUB_WORKSPACE/backup-out/dbai-git-mirror.bundle"
          )

          echo "Artifacts created:"
          ls -lh backup-out
          du -sh backup-out

      - name: Publish verified backup release
        id: publish
        shell: bash
        env:
          BACKUP_TAG: ${{ steps.backup.outputs.tag }}
          BACKUP_TITLE: ${{ steps.backup.outputs.title }}
          BACKUP_COMMIT: ${{ steps.backup.outputs.commit }}
        run: |
          set -euo pipefail
          RELEASE_CREATED=0
          cleanup_partial_release() {
            status=$?
            if [[ $status -ne 0 ]]; then
              echo "::error::Backup publication failed; attempting to remove the partial backup release and tag."
              # Try deleting a release even if gh release create failed halfway through.
              gh release delete "$BACKUP_TAG" --repo "$REPOSITORY" --cleanup-tag --yes || true
              git push origin ":refs/tags/$BACKUP_TAG" || true
            fi
            exit "$status"
          }
          trap cleanup_partial_release EXIT

          gh release create "$BACKUP_TAG" backup-out/*             --repo "$REPOSITORY"             --target "$BACKUP_COMMIT"             --title "$BACKUP_TITLE"             --notes "Verified DBAI source and Git-history backup. Source commit: $BACKUP_COMMIT. See backup-manifest.json and docs/DBAI-BACKUP-RESTORE.md for scope and restore instructions."             --prerelease
          RELEASE_CREATED=1

          # Verify the release exists and every expected artifact was uploaded.
          gh release view "$BACKUP_TAG" --repo "$REPOSITORY" --json tagName,name,assets,url             > backup-out/published-release-verification.json
          jq -e --arg tag "$BACKUP_TAG" '.tagName == $tag' backup-out/published-release-verification.json >/dev/null
          for asset in dbai-source-snapshot.tar.gz dbai-git-mirror.bundle release-metadata.json tracked-files.txt backup-manifest.json SHA256SUMS; do
            jq -e --arg name "$asset" '.assets[] | select(.name == $name)' backup-out/published-release-verification.json >/dev/null
          done

          REMOTE_CHECK_DIR="$RUNNER_TEMP/dbai-backup-remote-check"
          mkdir -p "$REMOTE_CHECK_DIR"
          gh release download "$BACKUP_TAG" --repo "$REPOSITORY" --dir "$REMOTE_CHECK_DIR"
          (
            cd "$REMOTE_CHECK_DIR"
            sha256sum -c SHA256SUMS
            gzip -t dbai-source-snapshot.tar.gz
            # Verify the downloaded bundle from a clean repository, not the runner's checkout.
            git init --quiet "$REMOTE_CHECK_DIR/verify-repo"
            git -C "$REMOTE_CHECK_DIR/verify-repo" bundle verify "$REMOTE_CHECK_DIR/dbai-git-mirror.bundle"
          )

          echo "Backup release verified: https://github.com/$REPOSITORY/releases/tag/$BACKUP_TAG"
          trap - EXIT

      - name: Report backup location
        if: success()
        run: |
          echo "## DBAI repository backup verified" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: `$REPOSITORY`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: `${{ steps.backup.outputs.commit }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: [`${{ steps.backup.outputs.tag }}`](https://github.com/$REPOSITORY/releases/tag/${{ steps.backup.outputs.tag }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifacts: source snapshot, Git bundle, release metadata, tracked file list, manifest, SHA-256 checksums." >> "$GITHUB_STEP_SUMMARY"
