name: DBAI Firmware Validation

on:
  push:
    paths:
      - ".github/workflows/armbian-build.yml"
      - ".github/workflows/ai-stack-validation.yml"
      - "extensions/ai-*.sh"
      - "lib/functions/image/partitioning.sh"
      - "config/boards/aml-s9xx-box.tvb"
      - "docs/AI-STACK-FIRMWARE.md"
      - "docs/IMAGE-PARTITIONS-WINDOWS.md"
      - "docs/PANDUAN-HERMES-9ROUTER.md"
      - "docs/PANDUAN-PROXMOX-COMMUNITY.md"
      - "docs/DBAI-ARMBIAN-BUILD.md"
      - "packages/bsp/common/usr/lib/armbian/armbian-firstlogin"
      - "packages/bsp/common/etc/update-motd.d/10-armbian-header"
      - "userpatches/config-default.conf"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/armbian-build.yml"
      - ".github/workflows/ai-stack-validation.yml"
      - "extensions/ai-*.sh"
      - "lib/functions/image/partitioning.sh"
      - "config/boards/aml-s9xx-box.tvb"
      - "docs/AI-STACK-FIRMWARE.md"
      - "docs/IMAGE-PARTITIONS-WINDOWS.md"
      - "docs/PANDUAN-HERMES-9ROUTER.md"
      - "docs/PANDUAN-PROXMOX-COMMUNITY.md"
      - "docs/DBAI-ARMBIAN-BUILD.md"
      - "packages/bsp/common/usr/lib/armbian/armbian-firstlogin"
      - "packages/bsp/common/etc/update-motd.d/10-armbian-header"
      - "userpatches/config-default.conf"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ai-stack:
    name: Validate AI extensions, presets and image partition layout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in extensions/ai-stack-common.sh extensions/ai-hermes.sh extensions/ai-router9.sh extensions/ai-hermes-router9.sh; do
            test -s "$file"
            bash -n "$file"
            echo "Shell syntax OK: $file"
          done
          # bash -n on the extension cannot parse shell programs embedded in heredocs;
          # extract the generated first-boot and helper scripts and validate them too.
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import tempfile

          source = pathlib.Path("extensions/ai-stack-common.sh").read_text(encoding="utf-8")
          blocks = [
              ("DBAI_AI_FIRSTBOOT", "bash"),
              ("DBAI_HERMES_WRAPPER", "bash"),
              ("DBAI_AI_SETUP", "bash"),
              ("DBAI_AI_MOTD", "sh"),
          ]
          with tempfile.TemporaryDirectory() as tmp:
              for tag, shell in blocks:
                  match = re.search(r"<<'" + re.escape(tag) + r"'\n(.*?)\n" + re.escape(tag) + r"(?:\n|$)", source, re.DOTALL)
                  if not match:
                      raise SystemExit(f"Could not extract generated script {tag}.")
                  path = pathlib.Path(tmp) / f"{tag}.{shell}"
                  path.write_text(match.group(1) + "\n", encoding="utf-8")
                  result = subprocess.run([shell, "-n", str(path)], text=True, capture_output=True)
                  if result.returncode:
                      raise SystemExit(f"Syntax check failed for generated {tag}:\n{result.stderr}")
                  print(f"Embedded script syntax OK: {tag}")
          PY

      - name: Validate Windows-visible FAT boot partition
        shell: bash
        run: |
          set -euo pipefail
          bash -n lib/functions/image/partitioning.sh
          grep -Fq 'BOOTFS_TYPE="fat"' config/boards/aml-s9xx-box.tvb || {
            echo "::error::aml-s9xx-box must retain the FAT boot filesystem."
            exit 1
          }
          grep -Fq 'if [[ "$BOARD" == "aml-s9xx-box" && "$bootfs" == "fat" ]]; then' lib/functions/image/partitioning.sh || {
            echo "::error::Amlogic FAT boot partition compatibility condition is missing."
            exit 1
          }
          grep -Fq 'local type="0c"' lib/functions/image/partitioning.sh || {
            echo "::error::Amlogic FAT boot partition must use MBR type 0x0C (FAT32-LBA)."
            exit 1
          }
          grep -Fq '"mkfs.${mkfs[$bootfs]}" -F32' lib/functions/image/partitioning.sh || {
            echo "::error::Amlogic FAT boot partition must be explicitly formatted as FAT32."
            exit 1
          }
          grep -Fq 'sfdisk --json "$raw_image"' .github/workflows/armbian-build.yml || {
            echo "::error::Build workflow must verify the final image partition table before publishing."
            exit 1
          }
          grep -Fq 'blkid -s TYPE -o value "$boot_partition"' .github/workflows/armbian-build.yml || {
            echo "::error::Build workflow must verify the FAT boot filesystem before publishing."
            exit 1
          }
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import textwrap

          workflow = pathlib.Path(".github/workflows/armbian-build.yml").read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^      - name: Prepare image and checksum for release\n.*?^        run: \|\n(.*?)(?=^      - name:|\Z)",
              workflow,
          )
          if not match:
              raise SystemExit("Could not locate the image preparation/QA shell block.")
          script = textwrap.dedent(match.group(1))
          result = subprocess.run(["bash", "-n"], input=script, text=True, capture_output=True)
          if result.returncode:
              raise SystemExit(f"Image preparation/QA shell syntax failed:\n{result.stderr}")
          print("Image preparation/QA shell syntax OK.")
          PY
          grep -Fq 'local type="ea"' lib/functions/image/partitioning.sh || {
            echo "::error::Generic Linux XBOOTLDR type must remain available for other boards."
            exit 1
          }
          grep -Fq 'BC13C2FF-59E6-4262-A352-B275FD6F7172' lib/functions/image/partitioning.sh || {
            echo "::error::Generic GPT XBOOTLDR type must remain unchanged."
            exit 1
          }
          test -s docs/IMAGE-PARTITIONS-WINDOWS.md
          echo "Partition regression checks passed: aml-s9xx-box FAT boot uses MBR type 0x0C; generic MBR/GPT behavior is preserved."

      - name: Validate first-login accounts, MOTD status, and kernel freeze
        shell: bash
        run: |
          set -euo pipefail
          firstlogin="packages/bsp/common/usr/lib/armbian/armbian-firstlogin"
          motd="packages/bsp/common/etc/update-motd.d/10-armbian-header"
          bash -n "$firstlogin"
          bash -n "$motd"

          grep -Fq '$3 >= 1000 && $1 != "nobody" && $6 ~ /^\/home\/[^/]+$/ && $7 !~ /\/(nologin|false)$/' "$firstlogin" || {
            echo "::error::First-login must only reuse a regular /home user with an interactive shell."
            exit 1
          }

          python3 - <<'PY'
          import subprocess

          # The first eligible account should be a normal login user, not a
          # package service account that happens to have UID >= 1000.
          fixture = """root:x:0:0:root:/root:/bin/bash
          ceph:x:1001:1001:Ceph service:/var/lib/ceph:/usr/sbin/nologin
          redis:x:1002:1002:Redis service:/var/lib/redis:/usr/sbin/nologin
          disabled:x:1003:1003:Disabled user:/home/disabled:/usr/sbin/nologin
          dbaiadmin:x:1004:1004:DBAI admin:/home/dbaiadmin:/bin/bash
          """.replace("          ", "")
          awk_rule = r'$3 >= 1000 && $1 != "nobody" && $6 ~ /^\/home\/[^/]+$/ && $7 !~ /\/(nologin|false)$/ {print $1; exit}'
          result = subprocess.run(["awk", "-F:", awk_rule], input=fixture, text=True,
                                  capture_output=True, check=True)
          selected = result.stdout.strip()
          if selected != "dbaiadmin":
              raise SystemExit(f"Expected dbaiadmin to be selected; got {selected!r}.")
          print("First-login selection test passed: service accounts are ignored.")
          PY

          grep -Fq 'BSPFREEZE="yes"' userpatches/config-default.conf || {
            echo "::error::Local build defaults must freeze Armbian BSP/kernel packages."
            exit 1
          }
          grep -Fq '"BSPFREEZE=yes"' .github/workflows/armbian-build.yml || {
            echo "::error::GitHub Actions builds must explicitly set BSPFREEZE=yes."
            exit 1
          }
          grep -Fq 'debian:bookworm|debian:trixie' "$motd" || {
            echo "::error::MOTD must correctly label Debian Bookworm/Trixie when distro metadata is unknown."
            exit 1
          }
          grep -Fq 'debian:bullseye) DISTRO_STATUS=' "$motd" && grep -Fq 'LTS' "$motd" || {
            echo "::error::MOTD must not mislabel Debian Bullseye LTS as EOL in the unknown-metadata fallback."
            exit 1
          }
          grep -Fq 'if root_passwd_output="$(printf' "$firstlogin" || {
            echo "::error::First-login must check whether root password assignment succeeds."
            exit 1
          }
          grep -Fq 'the system rejected the root password' "$firstlogin" || {
            echo "::error::First-login must display rejected root-password errors instead of proceeding silently."
            exit 1
          }
          grep -Fq 'if ! user_passwd_output="$(printf' "$firstlogin" || {
            echo "::error::First-login must check whether the regular user's password assignment succeeds."
            exit 1
          }
          test -s docs/PANDUAN-PROXMOX-COMMUNITY.md
          echo "First-login safety, MOTD fallback, and kernel freeze checks passed."

      - name: Test workflow matrix presets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tempfile
          import textwrap

          workflow_path = pathlib.Path(".github/workflows/armbian-build.yml")
          workflow = workflow_path.read_text(encoding="utf-8")

          # GitHub workflow_dispatch is limited to 25 inputs.
          inputs_block = workflow.split("    inputs:\n", 1)[1].split("\npermissions:", 1)[0]
          input_names = re.findall(r"^      ([a-z][a-z0-9_]*):\s*$", inputs_block, re.MULTILINE)
          if len(input_names) != 25:
              raise SystemExit(f"Expected 25 workflow inputs, found {len(input_names)}.")
          if len(input_names) != len(set(input_names)):
              raise SystemExit("Duplicate workflow_dispatch input names found.")

          app_block = inputs_block.split("      applications:\n", 1)[1].split("\n      home_assistant:", 1)[0]
          expected_choices = (
              "type: choice",
              'default: "all — Semua aplikasi standar + 3 varian AI"',
              '- "all — Semua aplikasi standar + 3 varian AI"',
              '- "ai-all — 3 varian AI + aplikasi yang dicentang"',
              '- "none — Hanya aplikasi yang dicentang (tanpa preset AI)"',
              '- "hermes — Hermes + aplikasi yang dicentang"',
              '- "9router — 9Router + aplikasi yang dicentang"',
              '- "both — Hermes + 9Router (satu image) + aplikasi yang dicentang"',
          )
          for expected in expected_choices:
              if expected not in app_block:
                  raise SystemExit(f"Application selector is missing {expected!r}.")

          choice_labels = {
              "all": "all — Semua aplikasi standar + 3 varian AI",
              "ai-all": "ai-all — 3 varian AI + aplikasi yang dicentang",
              "none": "none — Hanya aplikasi yang dicentang (tanpa preset AI)",
              "hermes": "hermes — Hermes + aplikasi yang dicentang",
              "9router": "9router — 9Router + aplikasi yang dicentang",
              "both": "both — Hermes + 9Router (satu image) + aplikasi yang dicentang",
          }

          generator_match = re.search(
              r"(?ms)^ {10}python3 - <<'PY' >> \"\$GITHUB_OUTPUT\"\n(.*?)^ {10}PY$",
              workflow,
          )
          if not generator_match:
              raise SystemExit("Could not locate the workflow matrix generator.")
          generator = textwrap.dedent(generator_match.group(1))
          ast.parse(generator, filename="workflow-matrix-generator.py")

          for mode in ("none", "hermes", "9router", "both", "ai-all", "all"):
              with tempfile.TemporaryDirectory() as tmp:
                  output_path = pathlib.Path(tmp) / "github-output.txt"
                  summary_path = pathlib.Path(tmp) / "summary.md"
                  env = os.environ.copy()
                  env.update({
                      "FILESYSTEM_INPUT": "both",
                      "OS_GROUP_INPUT": "all",
                      "SERVER": "true",
                      "MINIMAL": "true",
                      "APPLICATIONS": choice_labels[mode],
                      "HOME_ASSISTANT": "false",
                      "OPENMEDIAVAULT": "false",
                      "KALI": "false",
                      "DOCKER_CE": "false",
                      "CASAOS": "false",
                      "CCTV_LIGHTNVR": "false",
                      "DESKTOP_MODE": "none",
                      "DESKTOP_XFCE": "false",
                      "DESKTOP_MATE": "false",
                      "DESKTOP_GNOME": "false",
                      "DESKTOP_CINNAMON": "false",
                      "DESKTOP_KDE_PLASMA": "false",
                      "DESKTOP_I3_WM": "false",
                      "DESKTOP_ENLIGHTENMENT": "false",
                      "DESKTOP_BUDGIE": "false",
                      "DESKTOP_LXQT": "false",
                      "PROXMOX_MODE": "none",
                      "GITHUB_OUTPUT": str(output_path),
                      "GITHUB_STEP_SUMMARY": str(summary_path),
                  })
                  run = subprocess.run(
                      [sys.executable, "-c", generator],
                      env=env,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=False,
                  )
                  if run.returncode:
                      raise SystemExit(f"Matrix generation failed for preset {mode}:\n{run.stderr}\n{run.stdout}")
                  output_path.write_text(run.stdout, encoding="utf-8")
                  output_text = output_path.read_text(encoding="utf-8")
                  matrix_line = next((line for line in output_text.splitlines() if line.startswith("matrix=")), None)
                  if not matrix_line:
                      raise SystemExit(f"Matrix JSON missing for preset {mode}. Output: {output_text[:500]}")
                  matrix = json.loads(matrix_line[len("matrix="):])["include"]
                  variants = {row["variant"] for row in matrix}
                  ai_expected = {
                      "none": set(),
                      "hermes": {"hermes-agent"},
                      "9router": {"9router"},
                      "both": {"hermes-9router"},
                      "ai-all": {"hermes-agent", "9router", "hermes-9router"},
                      "all": {"hermes-agent", "9router", "hermes-9router"},
                  }[mode]
                  ai_actual = variants & {"hermes-agent", "9router", "hermes-9router"}
                  if ai_actual != ai_expected:
                      raise SystemExit(f"Preset {mode} generated AI variants {sorted(ai_actual)}, expected {sorted(ai_expected)}.")
                  if any(row["profile"] == "desktop" for row in matrix):
                      raise SystemExit(f"Desktop mode none incorrectly generated desktop jobs for preset {mode}.")
                  if any(row["release"] not in {"bookworm", "trixie", "jammy", "noble", "resolute"} for row in matrix if row["variant"] in {"hermes-agent", "9router", "hermes-9router"}):
                      raise SystemExit(f"An unsupported OS release was scheduled for the AI stack preset {mode}.")
                  if any(row["image_size"] != 8192 for row in matrix if row["variant"] in {"hermes-agent", "9router", "hermes-9router"}):
                      raise SystemExit(f"An AI stack image did not use the 8192 MiB image target for preset {mode}.")
                  print(f"Matrix preset {mode}: {len(matrix)} jobs; AI variants={sorted(ai_actual)}")

          # Explicitly test the largest full matrix and its regression guard (198 jobs).
          with tempfile.TemporaryDirectory() as tmp:
              output_path = pathlib.Path(tmp) / "github-output.txt"
              summary_path = pathlib.Path(tmp) / "summary.md"
              env = os.environ.copy()
              env.update({
                  "FILESYSTEM_INPUT": "both",
                  "OS_GROUP_INPUT": "all",
                  "SERVER": "true",
                  "MINIMAL": "true",
                  "APPLICATIONS": "all",
                  "DESKTOP_MODE": "all",
                  "PROXMOX_MODE": "none",
                  "GITHUB_OUTPUT": str(output_path),
                  "GITHUB_STEP_SUMMARY": str(summary_path),
              })
              for name in ("HOME_ASSISTANT", "OPENMEDIAVAULT", "KALI", "DOCKER_CE", "CASAOS", "CCTV_LIGHTNVR",
                           "DESKTOP_XFCE", "DESKTOP_MATE", "DESKTOP_GNOME", "DESKTOP_CINNAMON",
                           "DESKTOP_KDE_PLASMA", "DESKTOP_I3_WM", "DESKTOP_ENLIGHTENMENT", "DESKTOP_BUDGIE", "DESKTOP_LXQT"):
                  env[name] = "false"
              run = subprocess.run([sys.executable, "-c", generator], env=env, text=True,
                                   stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              if run.returncode:
                  raise SystemExit(f"Full matrix regression test failed:\n{run.stderr}\n{run.stdout}")
              output_path.write_text(run.stdout, encoding="utf-8")
              matrix_line = next((line for line in output_path.read_text(encoding="utf-8").splitlines() if line.startswith("matrix=")), None)
              matrix = json.loads(matrix_line[len("matrix="):])["include"]
              if len(matrix) != 198:
                  raise SystemExit(f"Full matrix expected 198 jobs without Proxmox; got {len(matrix)}.")
              print("Full matrix regression check passed: 198 jobs without Proxmox.")
          PY

      - name: Verify installation and secret-handling safeguards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ghcr.io/decolua/9router:latest' extensions/ai-stack-common.sh
          grep -Fq 'chmod 0600 "$ROUTER_ENV"' extensions/ai-stack-common.sh
          grep -Fq 'API_KEY_SECRET="$(openssl rand -hex 32)"' extensions/ai-stack-common.sh
          grep -Fq 'MACHINE_ID_SALT="$(openssl rand -hex 32)"' extensions/ai-stack-common.sh
          grep -Fq 'REQUIRE_API_KEY=true' extensions/ai-stack-common.sh
          grep -Fq 'https://hermes-agent.nousresearch.com/install.sh' extensions/ai-stack-common.sh
          grep -Fq 'bash "$INSTALLER" --non-interactive --skip-browser' extensions/ai-stack-common.sh
          grep -Fq 'xz-utils' extensions/ai-stack-common.sh
          grep -Fq "unauthenticated /v1/models returned HTTP 200" extensions/ai-stack-common.sh
          grep -Fq 'decolua/9router/issues/2834' docs/AI-STACK-FIRMWARE.md
          grep -Fq 'bash "$INSTALLER" --non-interactive --skip-browser' extensions/ai-stack-common.sh
          grep -Fq 'providers.dbai-9router.api' extensions/ai-stack-common.sh
          grep -Fq 'api_key" | runuser --user dbai-hermes' extensions/ai-stack-common.sh
          grep -Fq 'sudo dbai-ai-setup --connect-hermes' docs/AI-STACK-FIRMWARE.md
          echo "AI setup, persistence, API authentication, and secret-handling checks passed."
