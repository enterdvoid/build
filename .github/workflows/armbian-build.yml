name: DBAI Armbian Build

on:
  # TEMPORARY: single XFCE regression job after validating the complete matrix.
  push:
    paths:
      - '.github/workflows/armbian-build.yml'
  workflow_dispatch:
    inputs:
      filesystem:
        description: "Filesystem untuk semua image yang dipilih"
        required: true
        type: choice
        default: both
        options:
          - both
          - ext4
          - btrfs
      os_group:
        description: "Kelompok OS: semua, Debian, Ubuntu, atau fokus Trixie"
        required: true
        type: choice
        default: all
        options:
          - all
          - debian
          - ubuntu
          - trixie
      all_build_types:
        description: "Build semua profil pada semua OS terpilih (mengabaikan checkbox profil lainnya)"
        required: true
        type: boolean
        default: false
      server:
        description: "Server: semua release dalam kelompok OS terpilih"
        required: true
        type: boolean
        default: false
      minimal:
        description: "Minimal: semua release dalam kelompok OS terpilih"
        required: true
        type: boolean
        default: false
      applications:
        description: "Applications: semua aplikasi pada OS yang kompatibel"
        required: true
        type: boolean
        default: false
      home_assistant:
        description: "Application: Home Assistant (Bookworm/Trixie)"
        required: true
        type: boolean
        default: false
      openmediavault:
        description: "Application: OpenMediaVault (Bookworm/Trixie)"
        required: true
        type: boolean
        default: false
      kali:
        description: "Application: Kali (Debian: Bookworm/Trixie/Forky)"
        required: true
        type: boolean
        default: false
      docker_ce:
        description: "Application: Docker CE (Bookworm/Trixie/Jammy/Noble/Resolute)"
        required: true
        type: boolean
        default: false
      all_desktops:
        description: "Desktop: semua environment aktif pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_xfce:
        description: "Desktop: XFCE pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_mate:
        description: "Desktop: MATE pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_gnome:
        description: "Desktop: GNOME pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_cinnamon:
        description: "Desktop: Cinnamon pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_kde_plasma:
        description: "Desktop: KDE Plasma pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_i3_wm:
        description: "Desktop: i3-wm pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_enlightenment:
        description: "Desktop: Enlightenment pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_budgie:
        description: "Desktop: Budgie pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dbai-armbian-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: matrix
        env:
          FILESYSTEM_INPUT: ${{ inputs.filesystem || (github.event_name == 'push' && 'both') || 'both' }}
          OS_GROUP_INPUT: ${{ inputs.os_group || (github.event_name == 'push' && 'all') || 'all' }}
          ALL_BUILD_TYPES: ${{ inputs.all_build_types || (github.event_name == 'push' && true) }}
          TEST_ONLY: ${{ github.event_name == 'push' }}
          SERVER: ${{ inputs.server }}
          MINIMAL: ${{ inputs.minimal }}
          APPLICATIONS: ${{ inputs.applications }}
          HOME_ASSISTANT: ${{ inputs.home_assistant }}
          OPENMEDIAVAULT: ${{ inputs.openmediavault }}
          KALI: ${{ inputs.kali }}
          DOCKER_CE: ${{ inputs.docker_ce }}
          ALL_DESKTOPS: ${{ inputs.all_desktops }}
          DESKTOP_XFCE: ${{ inputs.desktop_xfce }}
          DESKTOP_MATE: ${{ inputs.desktop_mate }}
          DESKTOP_GNOME: ${{ inputs.desktop_gnome }}
          DESKTOP_CINNAMON: ${{ inputs.desktop_cinnamon }}
          DESKTOP_KDE_PLASMA: ${{ inputs.desktop_kde_plasma }}
          DESKTOP_I3_WM: ${{ inputs.desktop_i3_wm }}
          DESKTOP_ENLIGHTENMENT: ${{ inputs.desktop_enlightenment }}
          DESKTOP_BUDGIE: ${{ inputs.desktop_budgie }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys

          release_groups = {
              "all": ["bookworm", "trixie", "forky", "jammy", "noble", "resolute"],
              "debian": ["bookworm", "trixie", "forky"],
              "ubuntu": ["jammy", "noble", "resolute"],
              "trixie": ["trixie"],
          }
          release_group = os.environ.get("OS_GROUP_INPUT", "all").lower()
          if release_group not in release_groups:
              raise SystemExit(f"Unknown OS group: {release_group}")
          releases = release_groups[release_group]

          filesystem_input = os.environ.get("FILESYSTEM_INPUT", "both").lower()
          filesystems = ["ext4", "btrfs"] if filesystem_input == "both" else [filesystem_input]
          if any(fs not in ("ext4", "btrfs") for fs in filesystems):
              raise SystemExit(f"Invalid filesystem selection: {filesystem_input}")

          truthy = lambda name: os.environ.get(name, "false").lower() == "true"
          all_types = truthy("ALL_BUILD_TYPES")
          selected = {
              "server": all_types or truthy("SERVER"),
              "minimal": all_types or truthy("MINIMAL"),
          }

          # App support is explicit so an "all applications" run only creates compatible combinations.
          app_variants = [
              ("home-assistant", "applications-ha", "HOME_ASSISTANT", {"bookworm", "trixie"}),
              ("openmediavault", "applications-omv", "OPENMEDIAVAULT", {"bookworm", "trixie"}),
              ("kali", "applications-kali", "KALI", {"bookworm", "trixie", "forky"}),
              ("docker-ce", "docker-ce", "DOCKER_CE", {"bookworm", "trixie", "jammy", "noble", "resolute"}),
          ]
          select_all_apps = all_types or truthy("APPLICATIONS")
          selected_apps = [
              (variant, extension, supported_releases)
              for variant, extension, key, supported_releases in app_variants
              if select_all_apps or truthy(key)
          ]

          desktop_variants = [
              ("xfce", "DESKTOP_XFCE", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("mate", "DESKTOP_MATE", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("gnome", "DESKTOP_GNOME", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("cinnamon", "DESKTOP_CINNAMON", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("kde-plasma", "DESKTOP_KDE_PLASMA", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("i3-wm", "DESKTOP_I3_WM", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("enlightenment", "DESKTOP_ENLIGHTENMENT", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("budgie", "DESKTOP_BUDGIE", {"bookworm", "trixie", "noble"}),
          ]
          selected_desktops = [
              (variant, supported_releases)
              for variant, key, supported_releases in desktop_variants
              if all_types or truthy("ALL_DESKTOPS") or truthy(key)
          ]

          matrix = []
          for fs in filesystems:
              for profile in ("server", "minimal"):
                  if not selected[profile]:
                      continue
                  for release in releases:
                      matrix.append({
                          "filesystem": fs, "profile": profile, "variant": profile,
                          "release": release, "image_size": 4096,
                          "build_desktop": "no",
                          "build_minimal": "yes" if profile == "minimal" else "no",
                          "extension": "", "desktop_env": ""
                      })

              for variant, extension, supported_releases in selected_apps:
                  for release in releases:
                      if release not in supported_releases:
                          continue
                      matrix.append({
                          "filesystem": fs, "profile": "applications", "variant": variant,
                          "release": release, "image_size": 8192,
                          "build_desktop": "no", "build_minimal": "no",
                          "extension": extension, "desktop_env": ""
                      })

              for desktop, supported_releases in selected_desktops:
                  for release in releases:
                      if release not in supported_releases:
                          continue
                      matrix.append({
                          "filesystem": fs, "profile": "desktop", "variant": desktop,
                          "release": release, "image_size": 8192,
                          "build_desktop": "yes", "build_minimal": "no",
                          "extension": "", "desktop_env": desktop
                      })

          full_matrix_count = len(matrix)
          print(f"Full selected matrix: {full_matrix_count} jobs for OS group '{release_group}' and filesystem(s): {', '.join(filesystems)}", file=sys.stderr)
          if truthy("TEST_ONLY"):
              matrix = [
                  job for job in matrix
                  if job["filesystem"] == "ext4"
                  and job["profile"] == "desktop"
                  and job["variant"] == "xfce"
                  and job["release"] == "trixie"
              ]
              if len(matrix) != 1:
                  raise SystemExit(f"Regression filter expected one XFCE/Trixie/ext4 job, got {len(matrix)}")
              print(f"::notice::Matrix expansion validated ({full_matrix_count} jobs); running only one regression build.", file=sys.stderr)
          if not matrix:
              raise SystemExit("Tidak ada build yang dipilih. Pilih satu atau beberapa profil image.")
          if len(matrix) > 256:
              raise SystemExit(f"Matriks menghasilkan {len(matrix)} job; batas GitHub Actions adalah 256.")
          print(f"Jobs submitted to GitHub Actions: {len(matrix)}", file=sys.stderr)
          print("matrix=" + json.dumps({"include": matrix}, separators=(",", ":")))
          print("count=" + str(len(matrix)))
          PY
      - name: Show selected matrix
        env:
          FILESYSTEM_INPUT: ${{ inputs.filesystem || (github.event_name == 'push' && 'both') || 'both' }}
          OS_GROUP_INPUT: ${{ inputs.os_group || (github.event_name == 'push' && 'all') || 'all' }}
          ALL_BUILD_TYPES: ${{ inputs.all_build_types || (github.event_name == 'push' && true) }}
        run: |
          echo "Filesystem(s): $FILESYSTEM_INPUT"
          echo "OS release group: $OS_GROUP_INPUT"
          echo "Build all profiles: $ALL_BUILD_TYPES"
          echo "Build matrix generated."

  create_release:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Create descriptive release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
          FILESYSTEM_INPUT: ${{ inputs.filesystem || (github.event_name == 'push' && 'both') || 'both' }}
          OS_GROUP_INPUT: ${{ inputs.os_group || (github.event_name == 'push' && 'all') || 'all' }}
          ALL_BUILD_TYPES: ${{ inputs.all_build_types || (github.event_name == 'push' && true) }}
          TEST_ONLY: ${{ github.event_name == 'push' }}
          SERVER: ${{ inputs.server }}
          MINIMAL: ${{ inputs.minimal }}
          APPLICATIONS: ${{ inputs.applications }}
          HOME_ASSISTANT: ${{ inputs.home_assistant }}
          OPENMEDIAVAULT: ${{ inputs.openmediavault }}
          KALI: ${{ inputs.kali }}
          DOCKER_CE: ${{ inputs.docker_ce }}
          ALL_DESKTOPS: ${{ inputs.all_desktops }}
          DESKTOP_XFCE: ${{ inputs.desktop_xfce }}
          DESKTOP_MATE: ${{ inputs.desktop_mate }}
          DESKTOP_GNOME: ${{ inputs.desktop_gnome }}
          DESKTOP_CINNAMON: ${{ inputs.desktop_cinnamon }}
          DESKTOP_KDE_PLASMA: ${{ inputs.desktop_kde_plasma }}
          DESKTOP_I3_WM: ${{ inputs.desktop_i3_wm }}
          DESKTOP_ENLIGHTENMENT: ${{ inputs.desktop_enlightenment }}
          DESKTOP_BUDGIE: ${{ inputs.desktop_budgie }}
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(TZ=Asia/Jakarta date -d "$RUN_STARTED_AT" +'%Y-%m-%d_%H-%M')"
          tag="dbai-armbian-build-${RUN_ID}"
          release_title="DBAI Armbian Build ${stamp}"
          notes_file="release-summary.md"
          {
            echo '# DBAI Armbian Build'
            echo
            echo "**Workflow started (Asia/Jakarta): ${stamp}**"
            echo
            echo '## Build selection'
            echo
            echo "- **OS release group:** ${OS_GROUP_INPUT}"
            echo "- **Filesystem target:** ${FILESYSTEM_INPUT}"
            if [[ "$TEST_ONLY" == "true" ]]; then
              echo '- **Temporary regression test:** full matrix expansion validated; only ext4 / desktop / xfce / trixie was actually built and uploaded.'
            elif [[ "$ALL_BUILD_TYPES" == "true" ]]; then
              echo '- **Profiles:** Server and Minimal on every selected OS release; all compatible application variants; all buildable desktop environments on compatible releases; .'
            else
              if [[ "$SERVER" == "true" ]]; then echo '- **Profile:** Server on every selected OS release'; fi
              if [[ "$MINIMAL" == "true" ]]; then echo '- **Profile:** Minimal on every selected OS release'; fi
              if [[ "$APPLICATIONS" == "true" ]]; then echo '- **Profile:** all compatible Applications variants'; fi
              if [[ "$HOME_ASSISTANT" == "true" ]]; then echo '- **Application:** Home Assistant on supported releases'; fi
              if [[ "$OPENMEDIAVAULT" == "true" ]]; then echo '- **Application:** OpenMediaVault on supported releases'; fi
              if [[ "$KALI" == "true" ]]; then echo '- **Application:** Kali on Debian releases'; fi
              if [[ "$DOCKER_CE" == "true" ]]; then echo '- **Application:** Docker CE on supported Debian/Ubuntu releases'; fi
              if [[ "$ALL_DESKTOPS" == "true" ]]; then
                echo '- **Profile:** '
              else
                if [[ "$DESKTOP_XFCE" == "true" ]]; then echo '- **Desktop:** XFCE on compatible selected OS releases'; fi
                if [[ "$DESKTOP_MATE" == "true" ]]; then echo '- **Desktop:** MATE on compatible selected OS releases'; fi
                if [[ "$DESKTOP_GNOME" == "true" ]]; then echo '- **Desktop:** GNOME on compatible selected OS releases'; fi
                if [[ "$DESKTOP_CINNAMON" == "true" ]]; then echo '- **Desktop:** Cinnamon on compatible selected OS releases'; fi
                if [[ "$DESKTOP_KDE_PLASMA" == "true" ]]; then echo '- **Desktop:** KDE Plasma on compatible selected OS releases'; fi
                if [[ "$DESKTOP_I3_WM" == "true" ]]; then echo '- **Desktop:** i3-wm on compatible selected OS releases'; fi
                if [[ "$DESKTOP_ENLIGHTENMENT" == "true" ]]; then echo '- **Desktop:** Enlightenment on compatible selected OS releases'; fi
                if [[ "$DESKTOP_BUDGIE" == "true" ]]; then echo '- **Desktop:** Budgie on compatible selected OS releases'; fi
              fi
            fi
            echo
            echo '## Application compatibility'
            echo
            echo '- Home Assistant and OpenMediaVault: Debian Bookworm/Trixie.'
            echo '- Kali: Debian Bookworm/Trixie/Forky only.'
            echo '- Docker CE: Debian Bookworm/Trixie and Ubuntu Jammy/Noble/Resolute.'
            echo '- Desktop group builds XFCE, MATE, GNOME, Cinnamon, KDE Plasma, i3-wm, Enlightenment, and Budgie only where the current Armbian desktop definitions declare them available.'
            echo '- KDE Neon, Xmonad, and Deepin are skipped because current Armbian configng marks them unsupported or disabled.'
            echo
            echo '## Common image parameters'
            echo
            echo '- **Board:** `aml-s9xx-box`'
            echo '- **Kernel branch:** `current`'
            echo '- **Boot partition request:** 256 MiB'
            echo '- **Requested raw image size:** Server/Minimal 4096 MiB; Applications/Desktop 8192 MiB'
            echo '- **Image output:** compressed XZ when produced by Armbian Builder, with SHA-256 checksum'
            echo
            echo '## Notes'
            echo
            echo '- This section documents the selected build matrix. Only successful jobs upload image and checksum assets.'
            echo '- Requested raw image size is not the compressed download file size.'
            echo '- Actual image filenames and compressed sizes are shown in the Release assets list.'
            echo
            echo "[Open GitHub Actions run](https://github.com/${GH_REPO}/actions/runs/${RUN_ID})"
          } > "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$release_title" --notes-file "$notes_file" --prerelease --latest=false
          else
            gh release create "$tag" --title "$release_title" --notes-file "$notes_file" --prerelease --latest=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: [prepare, create_release]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.filesystem }} / ${{ matrix.profile }} / ${{ matrix.variant }} / ${{ matrix.release }}
    steps:
      - name: Maximize available build disk
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout Armbian builder and local customizations
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # maximize-build-space gives the workspace a large dedicated volume, but
      # Docker normally stores layers under /var/lib/docker on the nearly-full root.
      # Move Docker's fresh data root onto the workspace volume before pulling/building.
      - name: Move Docker storage to large build volume
        shell: bash
        run: |
          set -euo pipefail
          docker_root="$GITHUB_WORKSPACE/.docker-data"
          echo "Docker data root will be: $docker_root"
          # Keep Docker's layers on the large workspace filesystem, but tell Git not to scan this root-owned data directory.
          exclude_file="$GITHUB_WORKSPACE/.git/info/exclude"
          grep -qxF '/.docker-data/' "$exclude_file" || printf '\n/.docker-data/\n' >> "$exclude_file"
          sudo systemctl stop docker.socket docker.service || true
          sudo mkdir -p "$docker_root"
          sudo chown root:root "$docker_root"
          sudo python3 - "$docker_root" <<'PY'
          import json, os, sys
          path = "/etc/docker/daemon.json"
          try:
              with open(path, encoding="utf-8") as f:
                  config = json.load(f)
          except FileNotFoundError:
              config = {}
          config["data-root"] = sys.argv[1]
          tmp = path + ".tmp"
          with open(tmp, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          os.replace(tmp, path)
          PY
          sudo systemctl start docker
          for i in {1..30}; do
            if docker info >/dev/null 2>&1; then break; fi
            sleep 2
          done
          actual_root="$(docker info --format '{{.DockerRootDir}}')"
          echo "DockerRootDir=$actual_root"
          [[ "$actual_root" == "$docker_root" ]] || {
            echo "::error::Docker did not switch to the large workspace volume."
            exit 1
          }
          echo "=== Filesystem containing Docker data root ==="
          df -h "$docker_root"
          df -h "$GITHUB_WORKSPACE"

      - name: Show runner specs and selected build configuration
        env:
          FS: ${{ matrix.filesystem }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
          RELEASE: ${{ matrix.release }}
          IMAGE_SIZE: ${{ matrix.image_size }}
          BUILD_DESKTOP: ${{ matrix.build_desktop }}
          BUILD_MINIMAL: ${{ matrix.build_minimal }}
          EXTENSION: ${{ matrix.extension }}
          DESKTOP_ENV: ${{ matrix.desktop_env }}
        run: |
          echo "========== DBAI ARMBIAN BUILD: PRE-BUILD REPORT =========="
          echo "=== Selected build ==="
          echo "Board: aml-s9xx-box"
          echo "Filesystem: $FS"
          echo "Profile / variant: $PROFILE / $VARIANT"
          echo "Release: $RELEASE"
          echo "Image size: ${IMAGE_SIZE} MiB"
          echo "BUILD_DESKTOP=$BUILD_DESKTOP"
          echo "BUILD_MINIMAL=$BUILD_MINIMAL"
          echo "Extension: ${EXTENSION:-none}"
          echo "Desktop environment: ${DESKTOP_ENV:-none}"
          echo "=== Runner OS ==="
          cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION_ID)=' || true
          uname -a
          echo "=== CPU ==="
          lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|CPU MHz|Thread|Core|Socket|Virtualization):' || true
          echo "=== RAM and swap ==="
          free -h
          swapon --show || true
          echo "=== Disk space ==="
          df -h /
          df -h "$GITHUB_WORKSPACE"
          df -ih /
          echo "=== Docker ==="
          docker --version
          docker info --format 'Docker root: {{.DockerRootDir}} | Storage driver: {{.Driver}}' || true
          docker system df || true
          echo "=========================================================="

      - name: Ensure custom extension directory exists
        shell: bash
        run: |
          mkdir -p userpatches/extensions
          touch userpatches/extensions/.gitkeep

      - name: Check custom board configuration
        run: |
          test -f config/boards/aml-s9xx-box.tvb || {
            echo "::error::config/boards/aml-s9xx-box.tvb is missing. Commit the custom board file to this repository."
            exit 1
          }
          echo "Custom board configuration found."
          if [[ -d userpatches ]]; then
            echo "userpatches directory found."
          else
            echo "No userpatches directory in checkout; continuing."
          fi

      - name: Check Btrfs support on runner
        if: matrix.filesystem == 'btrfs'
        run: |
          sudo modprobe btrfs || true
          if [[ ! -d /sys/module/btrfs ]]; then
            echo "::error::The GitHub runner kernel does not expose Btrfs support; cannot run ROOTFS_TYPE=btrfs on this runner."
            exit 1
          fi
          echo "Btrfs kernel support is available."

      # Register QEMU/binfmt on the runner host so Docker can execute ARM64
      # userspace while the x86_64 GitHub runner builds the ARM64 rootfs.
      - name: Enable ARM64 emulation with QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Verify ARM64 container emulation
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing ARM64 container execution before starting Armbian build..."
          result="$(docker run --rm --platform linux/arm64 alpine:3.20 uname -m)"
          echo "ARM64 container reported architecture: $result"
          [[ "$result" == "aarch64" || "$result" == "arm64" ]] || {
            echo "::error::QEMU/binfmt verification failed; expected aarch64/arm64, got: $result"
            exit 1
          }
          echo "ARM64 emulation is ready."

      - name: Build Armbian image
        env:
          FS: ${{ matrix.filesystem }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
          RELEASE: ${{ matrix.release }}
          IMAGE_SIZE: ${{ matrix.image_size }}
          BUILD_DESKTOP: ${{ matrix.build_desktop }}
          BUILD_MINIMAL: ${{ matrix.build_minimal }}
          EXTENSION: ${{ matrix.extension }}
          DESKTOP_ENV: ${{ matrix.desktop_env }}
        run: |
          set -o pipefail
          args=(
            "BOARD=aml-s9xx-box"
            "BOOTSIZE=256"
            "FIXED_IMAGE_SIZE=${IMAGE_SIZE}"
            "ROOTFS_TYPE=${FS}"
            "BRANCH=current"
            "BUILD_DESKTOP=${BUILD_DESKTOP}"
            "BUILD_MINIMAL=${BUILD_MINIMAL}"
            "COMPRESS_OUTPUTIMAGE=sha,xz"
            "IMAGE_XZ_COMPRESSION_RATIO=0"
            "KERNEL_GIT=shallow"
            "KERNEL_CONFIGURE=no"
          )
          if [[ -n "$EXTENSION" ]]; then
            args+=("ENABLE_EXTENSIONS=${EXTENSION}")
          fi
          if [[ "$PROFILE" == "desktop" ]]; then
            args+=("DESKTOP_ENVIRONMENT=${DESKTOP_ENV}" "DESKTOP_TIER=minimal")
          fi
          args+=("RELEASE=${RELEASE}")

          printf 'Running: ./compile.sh build'
          printf ' %q' "${args[@]}"
          printf '\n'

          ./compile.sh build "${args[@]}" 2>&1 | tee "build-${FS}-${PROFILE}-${VARIANT}-${RELEASE}.log"

      - name: Prepare image and checksum for release
        if: success()
        env:
          FS: ${{ matrix.filesystem }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
          RELEASE: ${{ matrix.release }}
        run: |
          set -euo pipefail
          mkdir -p dist
          image="$(find output/images -maxdepth 1 -type f \( -name '*.img.xz' -o -name '*.img' \) -print -quit)"
          if [[ -z "$image" ]]; then
            echo "::error::No .img.xz or .img file found in output/images."
            find output/images -maxdepth 1 -type f -print || true
            exit 1
          fi

          if [[ "$image" == *.img.xz ]]; then
            suffix="img.xz"
          else
            suffix="img"
          fi

          asset="aml-s9xx-box-${FS}-${RELEASE}-${PROFILE}-${VARIANT}.${suffix}"
          cp "$image" "dist/$asset"
          sha256sum "dist/$asset" > "dist/${asset}.sha256"
          ls -lh dist/

      - name: Upload image and checksum to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.create_release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Show runner specs and remaining storage (AFTER BUILD)
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/dbai-after-build-report.txt"
          {
            echo "========== DBAI ARMBIAN BUILD: AFTER BUILD REPORT =========="
            date -Is
            echo "=== Runner OS ==="
            cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION_ID)=' || true
            uname -a
            echo "=== CPU ==="
            lscpu | grep -E '^(Architecture|CPU|Model name|CPU MHz|Thread|Core|Socket|Virtualization)' || true
            echo "=== RAM and swap ==="
            free -h
            swapon --show || true
            echo "=== Remaining disk space ==="
            df -h / || true
            df -h "$GITHUB_WORKSPACE" || true
            df -ih / || true
            echo "=== Docker storage ==="
            docker info --format 'Docker root: {{.DockerRootDir}} | Storage driver: {{.Driver}}' || true
            docker system df || true
            echo "=========================================================="
          } | tee "$report"

      - name: Upload build log as Actions artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ matrix.filesystem }}-${{ matrix.profile }}-${{ matrix.variant }}-${{ matrix.release }}
          path: |
            build-${{ matrix.filesystem }}-${{ matrix.profile }}-${{ matrix.variant }}-${{ matrix.release }}.log
            output/logs/*.log.ans
            ${{ runner.temp }}/dbai-after-build-report.txt
          if-no-files-found: ignore
          retention-days: 7
