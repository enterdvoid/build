name: DBAI Armbian Build

on:
  workflow_dispatch:
    inputs:
      filesystem:
        description: "Filesystem untuk semua image yang dipilih"
        required: true
        type: choice
        default: both
        options:
          - both
          - ext4
          - btrfs
      os_group:
        description: "Semua OS, keluarga Debian/Ubuntu, atau satu release spesifik"
        required: true
        type: choice
        default: all
        options:
          - all
          - debian
          - ubuntu
          - bullseye
          - bookworm
          - trixie
          - forky
          - jammy
          - noble
          - resolute
      speedtest:
        description: "Jalankan Ookla Speedtest setelah pengecekan spesifikasi VM (per job build)"
        required: true
        type: boolean
        default: false
      cleanup_run_history:
        description: "HAPUS permanen riwayat workflow run di repository (tidak membangun image)"
        required: true
        type: boolean
        default: false
      confirm_run_history_cleanup:
        description: "Wajib pilih DELETE ALL RUN HISTORY untuk menjalankan penghapusan"
        required: true
        type: choice
        default: NO
        options:
          - NO
          - DELETE ALL RUN HISTORY
      server:
        description: "Server: semua release dalam kelompok OS terpilih"
        required: true
        type: boolean
        default: true
      minimal:
        description: "Minimal: semua release dalam kelompok OS terpilih"
        required: true
        type: boolean
        default: true
      applications:
        description: "Hanya mengatur aplikasi. all mengabaikan checkbox app; opsi lain menambahkan checkbox app. Server/Minimal/Desktop tetap terpisah."
        required: true
        type: choice
        default: "all — Semua aplikasi standar + 3 varian AI"
        options:
          - "all — Semua aplikasi standar + 3 varian AI"
          - "ai-all — 3 varian AI + aplikasi yang dicentang"
          - "none — Hanya aplikasi yang dicentang (tanpa preset AI)"
          - "hermes — Hermes + aplikasi yang dicentang"
          - "9router — 9Router + aplikasi yang dicentang"
          - "both — Hermes + 9Router (satu image) + aplikasi yang dicentang"
      home_assistant:
        description: "Application: Home Assistant (Bookworm/Trixie)"
        required: true
        type: boolean
        default: false
      openmediavault:
        description: "Application: OpenMediaVault (Bookworm/Trixie)"
        required: true
        type: boolean
        default: false
      kali:
        description: "Application: Kali (Debian: Bookworm/Trixie/Forky)"
        required: true
        type: boolean
        default: false
      docker_ce:
        description: "Application: Docker CE (Bookworm/Trixie/Jammy/Noble/Resolute)"
        required: true
        type: boolean
        default: false
      casaos:
        description: "Application: CasaOS (Bookworm ARM64; installed automatically on first boot)"
        required: true
        type: boolean
        default: false
      cctv_lightnvr:
        description: "CCTV: LightNVR + integrated go2rtc (Trixie ARM64; container pulls on first boot)"
        required: true
        type: boolean
        default: false
      desktop_mode:
        description: "Desktop: semua DE + Openbox, Openbox saja, pilihan DE khusus, atau tanpa desktop"
        required: true
        type: choice
        default: none
        options:
          - all
          - openbox
          - custom
          - none
      desktop_xfce:
        description: "Desktop: XFCE pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_mate:
        description: "Desktop: MATE pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_gnome:
        description: "Desktop: GNOME pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_cinnamon:
        description: "Desktop: Cinnamon pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_kde_plasma:
        description: "Desktop: KDE Plasma pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_lxqt:
        description: "Desktop: LXQt pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_i3_wm:
        description: "Desktop: i3-wm pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_enlightenment:
        description: "Desktop: Enlightenment pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_budgie:
        description: "Desktop: Budgie pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      proxmox_mode:
        description: "Proxmox: jangan build, Official VE 9, Community PXVIRT 8, atau keduanya"
        required: true
        type: choice
        default: none
        options:
          - none
          - official
          - community
          - both

permissions:
  contents: read

concurrency:
  group: dbai-armbian-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Generate build matrix
    if: inputs.cleanup_run_history != true
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: matrix
        env:
          FILESYSTEM_INPUT: ${{ inputs.filesystem }}
          OS_GROUP_INPUT: ${{ inputs.os_group }}
          SERVER: ${{ inputs.server }}
          MINIMAL: ${{ inputs.minimal }}
          APPLICATIONS: ${{ inputs.applications }}
          HOME_ASSISTANT: ${{ inputs.home_assistant }}
          OPENMEDIAVAULT: ${{ inputs.openmediavault }}
          KALI: ${{ inputs.kali }}
          DOCKER_CE: ${{ inputs.docker_ce }}
          CASAOS: ${{ inputs.casaos }}
          CCTV_LIGHTNVR: ${{ inputs.cctv_lightnvr }}
          DESKTOP_MODE: ${{ inputs.desktop_mode }}
          DESKTOP_XFCE: ${{ inputs.desktop_xfce }}
          DESKTOP_MATE: ${{ inputs.desktop_mate }}
          DESKTOP_GNOME: ${{ inputs.desktop_gnome }}
          DESKTOP_CINNAMON: ${{ inputs.desktop_cinnamon }}
          DESKTOP_KDE_PLASMA: ${{ inputs.desktop_kde_plasma }}
          DESKTOP_I3_WM: ${{ inputs.desktop_i3_wm }}
          DESKTOP_ENLIGHTENMENT: ${{ inputs.desktop_enlightenment }}
          DESKTOP_BUDGIE: ${{ inputs.desktop_budgie }}
          DESKTOP_LXQT: ${{ inputs.desktop_lxqt }}
          PROXMOX_MODE: ${{ inputs.proxmox_mode }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys

          release_groups = {
              "all": ["bullseye", "bookworm", "trixie", "forky", "jammy", "noble", "resolute"],
              "debian": ["bullseye", "bookworm", "trixie", "forky"],
              "ubuntu": ["jammy", "noble", "resolute"],
              "bullseye": ["bullseye"],
              "bookworm": ["bookworm"],
              "trixie": ["trixie"],
              "forky": ["forky"],
              "jammy": ["jammy"],
              "noble": ["noble"],
              "resolute": ["resolute"],
          }
          release_group = os.environ.get("OS_GROUP_INPUT", "all").lower()
          if release_group not in release_groups:
              raise SystemExit(f"Unknown OS group: {release_group}")
          releases = release_groups[release_group]

          filesystem_input = os.environ.get("FILESYSTEM_INPUT", "both").lower()
          filesystems = ["ext4", "btrfs"] if filesystem_input == "both" else [filesystem_input]
          if any(fs not in ("ext4", "btrfs") for fs in filesystems):
              raise SystemExit(f"Invalid filesystem selection: {filesystem_input}")

          truthy = lambda name: os.environ.get(name, "false").lower() == "true"
          selected = {
              "server": truthy("SERVER"),
              "minimal": truthy("MINIMAL"),
          }

          # App support is explicit so an "all applications" run only creates compatible combinations.
          app_variants = [
              ("home-assistant", "applications-ha", "HOME_ASSISTANT", {"bookworm", "trixie"}),
              ("openmediavault", "applications-omv", "OPENMEDIAVAULT", {"bookworm", "trixie"}),
              ("kali", "applications-kali", "KALI", {"bookworm", "trixie", "forky"}),
              ("docker-ce", "docker-ce", "DOCKER_CE", {"bookworm", "trixie", "jammy", "noble", "resolute"}),
              ("casaos", "applications-casaos", "CASAOS", {"bookworm"}),
              ("lightnvr-go2rtc", "cctv-lightnvr", "CCTV_LIGHTNVR", {"trixie"}),
          ]
          application_mode_input = os.environ.get("APPLICATIONS", "all").lower()
          # The UI choices include Indonesian descriptions; the short prefix is the stable preset key.
          application_mode = application_mode_input.partition(" — ")[0].strip()
          if application_mode not in {"all", "ai-all", "none", "hermes", "9router", "both"}:
              raise SystemExit(f"Invalid application preset: {application_mode_input}")
          select_all_apps = application_mode == "all"
          selected_apps = [
              (variant, extension, supported_releases)
              for variant, extension, key, supported_releases in app_variants
              if select_all_apps or truthy(key)
          ]

          # AI variants are deliberately a single dropdown input so this workflow
          # stays within GitHub Actions' 25-input limit. "all" selects all three;
          # individual presets select one mode and remain additive with app checkboxes.
          ai_stack_variants = [
              ("hermes-agent", "ai-hermes", {"bookworm", "trixie", "jammy", "noble", "resolute"}),
              ("9router", "ai-router9", {"bookworm", "trixie", "jammy", "noble", "resolute"}),
              ("hermes-9router", "ai-hermes-router9", {"bookworm", "trixie", "jammy", "noble", "resolute"}),
          ]
          ai_preset_variants = {
              "none": set(),
              "ai-all": {variant for variant, _, _ in ai_stack_variants},
              "hermes": {"hermes-agent"},
              "9router": {"9router"},
              "both": {"hermes-9router"},
              "all": {variant for variant, _, _ in ai_stack_variants},
          }
          selected_ai_variants = ai_preset_variants[application_mode]

          # Audited against armbian/configng desktop YAML: releases with ARM64 availability.
          # Supported and community variants are included; disabled/unsupported variants are excluded.
          desktop_mode = os.environ.get("DESKTOP_MODE", "none").lower()
          if desktop_mode not in {"all", "openbox", "custom", "none"}:
              raise SystemExit(f"Invalid desktop mode: {desktop_mode}")
          desktop_variants = [
              ("xfce", "DESKTOP_XFCE", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("mate", "DESKTOP_MATE", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("gnome", "DESKTOP_GNOME", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("cinnamon", "DESKTOP_CINNAMON", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("kde-plasma", "DESKTOP_KDE_PLASMA", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("i3-wm", "DESKTOP_I3_WM", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("enlightenment", "DESKTOP_ENLIGHTENMENT", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("budgie", "DESKTOP_BUDGIE", {"bookworm", "trixie", "noble"}),
              ("lxqt", "DESKTOP_LXQT", {"bookworm", "trixie", "forky", "jammy", "noble"}),
          ]
          selected_desktops = [
              (variant, supported_releases)
              for variant, key, supported_releases in desktop_variants
              if desktop_mode == "all" or (desktop_mode == "custom" and truthy(key))
          ]
          # Openbox is a standalone WM stack, not an Armbian configng DESKTOP_ENVIRONMENT.
          # "all" includes Openbox; "openbox" creates only the standalone WM stack.
          select_openbox = desktop_mode in {"all", "openbox"}
          # Bullseye is end-of-service here: Server/Minimal only, no Openbox Desktop variants.
          openbox_releases = {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}

          matrix = []
          for fs in filesystems:
              for profile in ("server", "minimal"):
                  if not selected[profile]:
                      continue
                  for release in releases:
                      matrix.append({
                          "filesystem": fs, "profile": profile, "variant": profile,
                          "release": release, "image_size": 4096,
                          "build_desktop": "no",
                          "build_minimal": "yes" if profile == "minimal" else "no",
                          "extension": "", "desktop_env": ""
                      })

              for variant, extension, supported_releases in selected_apps:
                  for release in releases:
                      if release not in supported_releases:
                          continue
                      matrix.append({
                          "filesystem": fs, "profile": "applications", "variant": variant,
                          "release": release,
                          "image_size": 8192,
                          "build_desktop": "no", "build_minimal": "no",
                          "extension": extension, "desktop_env": ""
                      })

              for variant, extension, supported_releases in ai_stack_variants:
                  if variant not in selected_ai_variants:
                      continue
                  for release in releases:
                      if release not in supported_releases:
                          continue
                      matrix.append({
                          "filesystem": fs, "profile": "applications", "variant": variant,
                          "release": release, "image_size": 8192,
                          "build_desktop": "no", "build_minimal": "no",
                          "extension": extension, "desktop_env": ""
                      })

              if select_openbox:
                  for release in releases:
                      if release not in openbox_releases:
                          continue
                      matrix.append({
                          "filesystem": fs, "profile": "desktop", "variant": "openbox",
                          "release": release, "image_size": 8192,
                          "build_desktop": "no", "build_minimal": "yes",
                          "extension": "desktop-openbox", "desktop_env": ""
                      })

              for desktop, supported_releases in selected_desktops:
                  for release in releases:
                      if release not in supported_releases:
                          continue
                      matrix.append({
                          "filesystem": fs, "profile": "desktop", "variant": desktop,
                          "release": release, "image_size": 8192,
                          "build_desktop": "yes", "build_minimal": "no",
                          "extension": "", "desktop_env": desktop
                      })

          # Proxmox variants use dedicated Debian bases independent of the general OS selector:
          # official Proxmox VE 9 packages on Trixie; community PXVIRT 8 packages on Bookworm.
          proxmox_mode = os.environ.get("PROXMOX_MODE", "none").lower()
          if proxmox_mode not in {"none", "official", "community", "both"}:
              raise SystemExit(f"Invalid Proxmox mode: {proxmox_mode}")
          proxmox_variants = []
          if proxmox_mode in {"official", "both"}:
              proxmox_variants.append(("proxmox-official", "proxmox-official", "trixie"))
          if proxmox_mode in {"community", "both"}:
              proxmox_variants.append(("proxmox-community", "proxmox-community", "bookworm"))
          for variant, extension, release in proxmox_variants:
              for fs in filesystems:
                  matrix.append({
                      "filesystem": fs, "profile": "proxmox", "variant": variant,
                      "release": release, "image_size": 8192,
                      "build_desktop": "no", "build_minimal": "no",
                      "extension": extension, "desktop_env": ""
                  })

          # Interleave filesystem/profile queues instead of scheduling all ext4 jobs before btrfs.
          # This brings long-running Desktop jobs into the queue earlier and balances runner utilization.
          bucket_order = [
              (fs, profile)
              for profile in ("server", "minimal", "applications", "desktop", "proxmox")
              for fs in filesystems
          ]
          matrix_queues = {
              key: [
                  row for row in matrix
                  if row["filesystem"] == key[0] and row["profile"] == key[1]
              ]
              for key in bucket_order
          }
          interleaved_matrix = []
          while any(matrix_queues.values()):
              for key in bucket_order:
                  if matrix_queues[key]:
                      interleaved_matrix.append(matrix_queues[key].pop(0))
          matrix = interleaved_matrix

          full_matrix_count = len(matrix)
          print(f"Full selected matrix: {full_matrix_count} jobs for OS group '{release_group}' and filesystem(s): {', '.join(filesystems)}", file=sys.stderr)
          if not matrix:
              raise SystemExit("Tidak ada build yang dipilih. Pilih satu atau beberapa profil image.")
          if len(matrix) > 256:
              raise SystemExit(f"Matriks menghasilkan {len(matrix)} job; batas GitHub Actions adalah 256.")

          matrix_keys = [
              (item["filesystem"], item["release"], item["profile"], item["variant"])
              for item in matrix
          ]
          if len(set(matrix_keys)) != len(matrix_keys):
              raise SystemExit("Matriks mengandung kombinasi build duplikat.")

          if (
              release_group == "all"
              and filesystem_input == "both"
              and selected["server"]
              and selected["minimal"]
              and select_all_apps
              and desktop_mode == "all"
          ):
              expected_default_jobs = (
                  198
                  + len(filesystems) * int(proxmox_mode in {"official", "both"})
                  + len(filesystems) * int(proxmox_mode in {"community", "both"})
              )
              if len(matrix) != expected_default_jobs:
                  raise SystemExit(
                      f"Default full matrix changed unexpectedly: expected {expected_default_jobs} jobs with selected Proxmox options, got {len(matrix)}."
                  )

          # Put a compact, OS-by-OS inventory in the Actions run summary.
          from collections import Counter
          counts = Counter((item["release"], item["filesystem"], item["profile"]) for item in matrix)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("# DBAI Armbian build matrix\n\n")
                  summary.write(f"**Total jobs:** {full_matrix_count}  \n")
                  summary.write(f"**OS group:** {release_group}  \n")
                  summary.write(f"**Filesystems:** {', '.join(filesystems)}\n\n")
                  summary.write("| OS release | Filesystem | Server | Minimal | Applications | Desktop / WM | Proxmox | Total |\n")
                  summary.write("|---|---|---:|---:|---:|---:|---:|---:|\n")
                  summary_releases = list(dict.fromkeys(releases + [item["release"] for item in matrix]))
                  for release in summary_releases:
                      for fs in filesystems:
                          row = [counts.get((release, fs, profile), 0) for profile in ("server", "minimal", "applications", "desktop", "proxmox")]
                          summary.write(f"| {release} | {fs} | {row[0]} | {row[1]} | {row[2]} | {row[3]} | {row[4]} | {sum(row)} |\n")

          print(f"Jobs submitted to GitHub Actions: {len(matrix)}", file=sys.stderr)
          print("matrix=" + json.dumps({"include": matrix}, separators=(",", ":")))
          print("count=" + str(len(matrix)))
          PY
      - name: Show selected matrix
        env:
          FILESYSTEM_INPUT: ${{ inputs.filesystem }}
          OS_GROUP_INPUT: ${{ inputs.os_group }}
          SERVER: ${{ inputs.server }}
          MINIMAL: ${{ inputs.minimal }}
          APPLICATIONS: ${{ inputs.applications }}
          DESKTOP_MODE: ${{ inputs.desktop_mode }}
          SPEEDTEST: ${{ inputs.speedtest }}
          CASAOS: ${{ inputs.casaos }}
          CCTV_LIGHTNVR: ${{ inputs.cctv_lightnvr }}
          PROXMOX_MODE: ${{ inputs.proxmox_mode }}
        run: |
          echo "Filesystem(s): $FILESYSTEM_INPUT"
          echo "OS release group: $OS_GROUP_INPUT"
          echo "Profile groups: server=$SERVER minimal=$MINIMAL desktop_mode=$DESKTOP_MODE"
          echo "Application preset: $APPLICATIONS"
          echo "Preset meaning: all = all standard apps + 3 AI variants (ignores individual app checkboxes); ai-all = 3 AI variants + checked app boxes; none = checked app boxes only, no AI preset. Server/Minimal/Desktop are selected independently."
          echo "Desktop mode: $DESKTOP_MODE (all = all supported DEs + Openbox; openbox = standalone; custom = individual DE checkboxes; none = no desktop)"
          echo "CasaOS (Bookworm): $CASAOS"
          echo "LightNVR + integrated go2rtc (Trixie): $CCTV_LIGHTNVR"
          echo "Proxmox selection: $PROXMOX_MODE (none / official / community / both)"
          echo "VM Speedtest enabled: $SPEEDTEST"
          echo "Build matrix generated."

  create_release:
    if: inputs.cleanup_run_history != true
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_title: ${{ steps.release.outputs.release_title }}
      image_version: ${{ steps.release.outputs.image_version }}
    steps:
      - name: Checkout and validate release prerequisites
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Check board and selected application extensions
        env:
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
        shell: bash
        run: |
          set -euo pipefail
          test -x ./compile.sh || { echo "::error::compile.sh is missing or not executable."; exit 1; }
          test -f config/boards/aml-s9xx-box.tvb || { echo "::error::config/boards/aml-s9xx-box.tvb is missing."; exit 1; }
          test -f userpatches/extensions/dbai-branding.sh || { echo "::error::userpatches/extensions/dbai-branding.sh is missing."; exit 1; }
          python3 - <<'PY'
          import json, os, pathlib
          matrix = json.loads(os.environ["MATRIX_JSON"])
          extension_by_variant = {
              "home-assistant": "applications-ha",
              "openmediavault": "applications-omv",
              "kali": "applications-kali",
              "docker-ce": "docker-ce",
              "openbox": "desktop-openbox",
              "proxmox-official": "proxmox-official",
              "proxmox-community": "proxmox-community",
              "casaos": "applications-casaos",
              "lightnvr-go2rtc": "cctv-lightnvr",
              "hermes-agent": "ai-hermes",
              "9router": "ai-router9",
              "hermes-9router": "ai-hermes-router9",
          }
          root = pathlib.Path(".")
          extension_rows = [row for row in matrix.get("include", []) if row.get("extension")]
          for row in extension_rows:
              variant = row.get("variant")
              extension = extension_by_variant.get(variant)
              if not extension:
                  raise SystemExit(f"Unknown extension-enabled variant in matrix: {variant!r}")
              if row.get("extension") != extension:
                  raise SystemExit(f"Variant {variant!r} expects extension {extension!r}, got {row.get('extension')!r}.")
              if variant in {"hermes-agent", "9router", "hermes-9router"} and not (root / "extensions" / "ai-stack-common.sh").is_file():
                  raise SystemExit(f"Shared AI extension helper is missing for variant {variant!r}.")
              candidates = (
                  root / "extensions" / f"{extension}.sh",
                  root / "extensions" / extension / f"{extension}.sh",
                  root / "userpatches" / "extensions" / f"{extension}.sh",
                  root / "userpatches" / "extensions" / extension / f"{extension}.sh",
              )
              if not any(path.is_file() for path in candidates):
                  raise SystemExit(f"Required Armbian extension '{extension}' not found for variant '{variant}'.")
          print(f"Preflight passed: board exists and all {len(extension_rows)} extension-enabled matrix entries map to available extensions.")
          PY
          for extension in extensions/proxmox-official.sh extensions/proxmox-community.sh extensions/applications-casaos.sh extensions/cctv-lightnvr.sh extensions/desktop-openbox.sh extensions/ai-stack-common.sh extensions/ai-hermes.sh extensions/ai-router9.sh extensions/ai-hermes-router9.sh; do
            bash -n "$extension"
            echo "Shell syntax OK: $extension"
          done

          # Guard against known repo/package regressions observed in actual build logs.
          grep -Fq 'URIs: http://download.proxmox.com/debian/pve' extensions/proxmox-official.sh || {
            echo "::error::Proxmox no-subscription repository must use its supported HTTP endpoint; APT verifies signed metadata with the Proxmox keyring."
            exit 1
          }
          if grep -Fq 'URIs: https://download.proxmox.com/debian/pve' extensions/proxmox-official.sh; then
            echo "::error::Unsupported HTTPS URL detected for Proxmox no-subscription repository."
            exit 1
          fi
          grep -Fq 'Enabled: no' extensions/proxmox-official.sh || {
            echo "::error::Proxmox enterprise source must be disabled with a valid Deb822 field."
            exit 1
          }
          grep -Fq 'https://us.mirrors.lierfang.com/pxcloud/pxvirt' extensions/proxmox-community.sh || {
            echo "::error::PXVIRT US mirror fallback is missing."
            exit 1
          }
          grep -Fq 'dists/bookworm/InRelease' extensions/proxmox-community.sh || {
            echo "::error::PXVIRT mirror must pass Release-file preflight before use."
            exit 1
          }
          grep -Fq 'chmod 1777 "${SDCARD}/tmp"' extensions/proxmox-community.sh || {
            echo "::error::PXVIRT extension must preserve standard /tmp permissions (01777) so APT's _apt user can verify repository signatures."
            exit 1
          }
          grep -Fq 'MAINTAINERMAIL=dbai.media@gmail.com' .github/workflows/armbian-build.yml || {
            echo "::error::Maintainer email must be dbai.media@gmail.com."
            exit 1
          }
          if ! grep -A4 -F '      desktop_mode:' .github/workflows/armbian-build.yml | grep -Fq '        default: none'; then
            echo "::error::Desktop selection must default to none."
            exit 1
          fi
          grep -Fq 'desktop_mode = os.environ.get("DESKTOP_MODE", "none").lower()' .github/workflows/armbian-build.yml || {
            echo "::error::Desktop matrix fallback must also default to none."
            exit 1
          }
          grep -Fq 'openbox_releases = {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}' .github/workflows/armbian-build.yml || {
            echo "::error::Openbox must not be scheduled for Bullseye; that release is limited to Server/Minimal."
            exit 1
          }
          grep -Fq 'network_applet_pkg="network-manager-applet"' extensions/desktop-openbox.sh || {
            echo "::error::Openbox must use network-manager-applet on Debian Forky."
            exit 1
          }
          grep -Fq 'ghcr.io/decolua/9router:latest' extensions/ai-stack-common.sh || {
            echo "::error::The 9Router ARM64 container definition is missing."
            exit 1
          }
          grep -Fq 'chmod 0600 "$ROUTER_ENV"' extensions/ai-stack-common.sh || {
            echo "::error::9Router credentials must be stored with root-only permissions."
            exit 1
          }
          grep -Fq 'https://hermes-agent.nousresearch.com/install.sh' extensions/ai-stack-common.sh || {
            echo "::error::Hermes must use its official installer endpoint."
            exit 1
          }
          grep -Fq 'providers.dbai-9router.api' extensions/ai-stack-common.sh || {
            echo "::error::Hermes + 9Router integration setup is missing."
            exit 1
          }
          echo "Regression checks passed for Proxmox APT sources, PXVIRT /tmp permissions and mirror fallback, maintainer email, desktop default, Openbox compatibility, and all AI-stack variants."
      - name: Create one release with selected profile title
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          FILESYSTEM_INPUT: ${{ inputs.filesystem }}
          OS_GROUP_INPUT: ${{ inputs.os_group }}
          SPEEDTEST: ${{ inputs.speedtest }}
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
          SERVER: ${{ inputs.server }}
          MINIMAL: ${{ inputs.minimal }}
          APPLICATIONS: ${{ inputs.applications }}
          HOME_ASSISTANT: ${{ inputs.home_assistant }}
          OPENMEDIAVAULT: ${{ inputs.openmediavault }}
          KALI: ${{ inputs.kali }}
          DOCKER_CE: ${{ inputs.docker_ce }}
          CASAOS: ${{ inputs.casaos }}
          CCTV_LIGHTNVR: ${{ inputs.cctv_lightnvr }}
          DESKTOP_MODE: ${{ inputs.desktop_mode }}
          DESKTOP_XFCE: ${{ inputs.desktop_xfce }}
          DESKTOP_MATE: ${{ inputs.desktop_mate }}
          DESKTOP_GNOME: ${{ inputs.desktop_gnome }}
          DESKTOP_CINNAMON: ${{ inputs.desktop_cinnamon }}
          DESKTOP_KDE_PLASMA: ${{ inputs.desktop_kde_plasma }}
          DESKTOP_I3_WM: ${{ inputs.desktop_i3_wm }}
          DESKTOP_ENLIGHTENMENT: ${{ inputs.desktop_enlightenment }}
          DESKTOP_BUDGIE: ${{ inputs.desktop_budgie }}
          DESKTOP_LXQT: ${{ inputs.desktop_lxqt }}
          PROXMOX_MODE: ${{ inputs.proxmox_mode }}
        shell: bash
        run: |
          set -euo pipefail
          run_started_at="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}" --jq '.run_started_at // .created_at')"
          if [[ -z "$run_started_at" || "$run_started_at" == "null" ]]; then
            echo "::error::Unable to retrieve workflow start time from GitHub Actions API."
            exit 1
          fi
          stamp="$(TZ=Asia/Jakarta date -d "$run_started_at" +'%Y-%m-%d_%H-%M')"
          image_version="26.11.0"
          echo "Workflow start time: ${run_started_at} -> ${stamp} (Asia/Jakarta)"
          echo "DBAI image/package version: ${image_version}"
          tag="dbai-armbian-build-${RUN_ID}"

          # Derive the category from the actual matrix so the title reflects what will be built.
          mapfile -t profiles < <(python3 - <<'PY'
          import json, os
          matrix = json.loads(os.environ["MATRIX_JSON"])
          profiles = {row["profile"] for row in matrix.get("include", [])}
          for name in ["server", "minimal", "applications", "desktop", "proxmox"]:
              if name in profiles:
                  print(name)
          PY
          )
          if [[ "${#profiles[@]}" -eq 0 ]]; then
            echo "::error::No selected profile found in generated matrix."
            exit 1
          fi
          standard_profiles=("server" "minimal" "applications" "desktop")
          standard_profile_count=0
          for standard_profile in "${standard_profiles[@]}"; do
            for profile in "${profiles[@]}"; do
              if [[ "$profile" == "$standard_profile" ]]; then
                standard_profile_count=$((standard_profile_count + 1))
                break
              fi
            done
          done
          if [[ "$standard_profile_count" -eq 4 ]]; then
            if [[ " ${profiles[*]} " == *" proxmox "* ]]; then
              category_title="All + Proxmox"
            else
              category_title="All"
            fi
          else
            category_title=""
            for profile in "${profiles[@]}"; do
              case "$profile" in
                server) display="Server" ;;
                minimal) display="Minimal" ;;
                applications) display="Applications" ;;
                desktop) display="Desktop" ;;
                proxmox) display="Proxmox" ;;
                *) echo "::error::Unknown profile: $profile"; exit 1 ;;
              esac
              if [[ -n "$category_title" ]]; then category_title+=" + "; fi
              category_title+="$display"
            done
          fi
          release_title="DBAI Armbian ${category_title} Build ${stamp}"
          notes_file="release-summary.md"
          {
            echo "# DBAI Armbian Build"
            echo
            echo "**Build started (Asia/Jakarta): ${stamp}**"
            echo
            echo '## Build selection'
            echo
            echo "- **OS release group:** ${OS_GROUP_INPUT}"
            echo "- **Filesystem target:** ${FILESYSTEM_INPUT}"
            echo "- **Embedded image version:** ${image_version}"
            echo "- **OS branding:** `Armbian-DBAI-2K26` / `DBAI-2K26 <release>`"
            echo "- **VM Speedtest:** ${SPEEDTEST} (one test per build job when enabled)"
            echo "- **Selected profile groups:** ${category_title}"
            echo "- **Desktop mode:** ${DESKTOP_MODE}"
            if [[ "$PROXMOX_MODE" == "official" || "$PROXMOX_MODE" == "both" ]]; then echo "- **Proxmox Official:** Proxmox VE 9 packages on Debian Trixie; retains Armbian kernel; experimental on Amlogic STB"; fi
            if [[ "$PROXMOX_MODE" == "community" || "$PROXMOX_MODE" == "both" ]]; then echo "- **Proxmox Community:** PXVIRT 8 on Debian Bookworm; retains Armbian kernel"; fi
            echo "- **Matrix jobs:** $(python3 -c 'import json,os; print(len(json.loads(os.environ["MATRIX_JSON"]).get("include", [])))')"
            echo "- **Image asset format:** `aml-s9xx-box-{filesystem}-{os-release}-{variant}.img.xz` (or `.img`)"
            if [[ "$SERVER" == "true" ]]; then echo '- **Profile:** Server on every selected OS release'; fi
            if [[ "$MINIMAL" == "true" ]]; then echo '- **Profile:** Minimal on every selected OS release'; fi
            if [[ "$APPLICATIONS" == "true" ]]; then
              echo '- **Profile:** all compatible Applications variants'
            else
              if [[ "$HOME_ASSISTANT" == "true" ]]; then echo '- **Application:** Home Assistant on supported releases'; fi
              if [[ "$OPENMEDIAVAULT" == "true" ]]; then echo '- **Application:** OpenMediaVault on supported releases'; fi
              if [[ "$KALI" == "true" ]]; then echo '- **Application:** Kali on Debian releases'; fi
              if [[ "$DOCKER_CE" == "true" ]]; then echo '- **Application:** Docker CE on supported Debian/Ubuntu releases'; fi
              if [[ "$CASAOS" == "true" ]]; then echo '- **Application:** CasaOS on Bookworm ARM64 (official installer runs on first boot)'; fi
              if [[ "$CCTV_LIGHTNVR" == "true" ]]; then echo '- **CCTV:** LightNVR 0.43.2 with integrated go2rtc on Trixie ARM64'; fi
            fi
            if [[ "$DESKTOP_MODE" == "all" ]]; then
              echo '- **Profile:** all buildable Desktop environments plus standalone Openbox WM on compatible selected OS releases'
            elif [[ "$DESKTOP_MODE" == "openbox" ]]; then
              echo '- **Window manager:** standalone Openbox WM'
            elif [[ "$DESKTOP_MODE" == "custom" ]]; then
              if [[ "$DESKTOP_XFCE" == "true" ]]; then echo '- **Desktop:** XFCE on compatible selected OS releases'; fi
              if [[ "$DESKTOP_MATE" == "true" ]]; then echo '- **Desktop:** MATE on compatible selected OS releases'; fi
              if [[ "$DESKTOP_GNOME" == "true" ]]; then echo '- **Desktop:** GNOME on compatible selected OS releases'; fi
              if [[ "$DESKTOP_CINNAMON" == "true" ]]; then echo '- **Desktop:** Cinnamon on compatible selected OS releases'; fi
              if [[ "$DESKTOP_KDE_PLASMA" == "true" ]]; then echo '- **Desktop:** KDE Plasma on compatible selected OS releases'; fi
              if [[ "$DESKTOP_I3_WM" == "true" ]]; then echo '- **Desktop:** i3-wm on compatible selected OS releases'; fi
              if [[ "$DESKTOP_ENLIGHTENMENT" == "true" ]]; then echo '- **Desktop:** Enlightenment on compatible selected OS releases'; fi
              if [[ "$DESKTOP_BUDGIE" == "true" ]]; then echo '- **Desktop:** Budgie on compatible selected OS releases'; fi
              if [[ "$DESKTOP_LXQT" == "true" ]]; then echo '- **Desktop:** LXQt on compatible selected OS releases'; fi
            fi
            echo
            echo '## Application compatibility'
            echo
            echo '- Bullseye: Server and Minimal only; Armbian marks this distribution end-of-service, so application and desktop variants are intentionally skipped.'
            echo '- Home Assistant and OpenMediaVault: Debian Bookworm/Trixie.'
            echo '- Kali: Debian Bookworm/Trixie/Forky only.'
            echo '- Docker CE: Debian Bookworm/Trixie and Ubuntu Jammy/Noble/Resolute.'
            echo '- CasaOS: Debian Bookworm ARM64; official installer runs from a systemd first-boot service and requires internet on first boot. CasaOS images use the same 8192 MiB raw image target as Desktop.'
            echo '- LightNVR + go2rtc: Debian Trixie ARM64; pinned LightNVR container includes/manages go2rtc, pulled by the first-boot systemd service. CCTV images use an 8192 MiB raw image target; mount recordings to external SSD/HDD for retention.'
            echo '- Desktop group builds XFCE, MATE, GNOME, Cinnamon, KDE Plasma, i3-wm, Enlightenment, Budgie, and LXQt only where Armbian configng declares ARM64 availability for that release.'
            echo '- Openbox is provided as a separate lightweight X11 window-manager session with LightDM, LXPanel, PCManFM, LXTerminal and NetworkManager tray support; it does not rely on DESKTOP_ENVIRONMENT.'
            echo '- KDE Neon, Xmonad, and Deepin are skipped because current Armbian configng marks them unsupported or disabled.'
            echo
            echo '## Common image parameters'
            echo
            echo "- **Vendor:** DBAI Armbian"
            echo "- **Image/package version:** ${image_version}"
            echo '- **Board:** `aml-s9xx-box`'
            echo '- **Kernel branch:** `current`'
            echo '- **Boot partition request:** 256 MiB'
            echo '- **Requested raw image size:** Server/Minimal 4096 MiB; Applications/Desktop/Openbox/CasaOS/Proxmox/LightNVR + go2rtc 8192 MiB'
            echo '- **Image output:** compressed XZ when produced by Armbian Builder, with SHA-256 checksum'
            echo
            echo '## Integrity and availability'
            echo
            echo '- Only successful jobs upload image assets.'
            echo '- A consolidated `SHA256SUMS.txt` is finalized after all matrix jobs finish; per-image checksum sidecars are removed only after upload succeeds.'
            echo '- Requested raw image size is not the compressed download file size.'
            echo '- Failed build jobs are excluded from the consolidated checksum file.'
            echo
            echo "[Open GitHub Actions run](https://github.com/${GH_REPO}/actions/runs/${RUN_ID})"
          } > "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$release_title" --notes-file "$notes_file" --prerelease --latest=false
          else
            gh release create "$tag" --title "$release_title" --notes-file "$notes_file" --prerelease --latest=false
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_title=$release_title" >> "$GITHUB_OUTPUT"
          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"
          echo "Prepared release: $release_title ($tag; image version $image_version)"
  build:
    if: inputs.cleanup_run_history != true
    needs: [prepare, create_release]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Four independent GitHub-hosted runners balance throughput with per-job disk and I/O demand.
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.filesystem }} / ${{ matrix.profile }} / ${{ matrix.variant }} / ${{ matrix.release }}
    steps:
      - name: Diagnose runner before disk setup
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          echo "Runner reached the build job at $(date -Is)"
          echo "Runner: $(uname -a)"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "=== Filesystems before disk setup ==="
          df -hT / /mnt "$GITHUB_WORKSPACE" || true
          echo "=== Block devices ==="
          lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS || true
          echo "=== Memory and swap ==="
          free -h
          swapon --show || true

      - name: Maximize available build disk (10-minute timeout)
        uses: easimon/maximize-build-space@v10
        timeout-minutes: 10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout Armbian builder and local customizations
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # maximize-build-space gives the workspace a large dedicated volume, but
      # Docker normally stores layers under /var/lib/docker on the nearly-full root.
      # Move Docker's fresh data root onto the workspace volume before pulling/building.
      - name: Move Docker storage to large build volume
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker_root="$GITHUB_WORKSPACE/.docker-data"
          echo "Docker data root will be: $docker_root"
          # Keep Docker's layers on the large workspace filesystem, but tell Git not to scan this root-owned data directory.
          exclude_file="$GITHUB_WORKSPACE/.git/info/exclude"
          grep -qxF '/.docker-data/' "$exclude_file" || printf '\n/.docker-data/\n' >> "$exclude_file"
          sudo systemctl stop docker.socket docker.service || true
          sudo mkdir -p "$docker_root"
          sudo chown root:root "$docker_root"
          sudo python3 - "$docker_root" <<'PY'
          import json, os, sys
          path = "/etc/docker/daemon.json"
          try:
              with open(path, encoding="utf-8") as f:
                  config = json.load(f)
          except FileNotFoundError:
              config = {}
          config["data-root"] = sys.argv[1]
          tmp = path + ".tmp"
          with open(tmp, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          os.replace(tmp, path)
          PY
          sudo systemctl start docker
          for i in {1..30}; do
            if docker info >/dev/null 2>&1; then break; fi
            sleep 2
          done
          actual_root="$(docker info --format '{{.DockerRootDir}}')"
          echo "DockerRootDir=$actual_root"
          [[ "$actual_root" == "$docker_root" ]] || {
            echo "::error::Docker did not switch to the large workspace volume."
            exit 1
          }
          echo "=== Filesystem containing Docker data root ==="
          df -h "$docker_root"
          df -h "$GITHUB_WORKSPACE"

      - name: Show runner specs and selected build configuration
        env:
          FS: ${{ matrix.filesystem }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
          RELEASE: ${{ matrix.release }}
          IMAGE_SIZE: ${{ matrix.image_size }}
          BUILD_DESKTOP: ${{ matrix.build_desktop }}
          BUILD_MINIMAL: ${{ matrix.build_minimal }}
          EXTENSION: ${{ matrix.extension }}
          DESKTOP_ENV: ${{ matrix.desktop_env }}
        run: |
          echo "========== DBAI ARMBIAN BUILD: PRE-BUILD REPORT =========="
          echo "=== Selected build ==="
          echo "Board: aml-s9xx-box"
          echo "Filesystem: $FS"
          echo "Profile / variant: $PROFILE / $VARIANT"
          echo "Release: $RELEASE"
          echo "Image size: ${IMAGE_SIZE} MiB"
          echo "BUILD_DESKTOP=$BUILD_DESKTOP"
          echo "BUILD_MINIMAL=$BUILD_MINIMAL"
          echo "Extension: ${EXTENSION:-none}"
          echo "Desktop environment: ${DESKTOP_ENV:-none}"
          echo "=== Runner OS ==="
          cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION_ID)=' || true
          uname -a
          echo "=== CPU ==="
          lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|CPU MHz|Thread|Core|Socket|Virtualization):' || true
          echo "=== RAM and swap ==="
          free -h
          swapon --show || true
          echo "=== Disk space ==="
          df -h /
          df -h "$GITHUB_WORKSPACE"
          df -ih /
          echo "=== Docker ==="
          docker --version
          docker info --format 'Docker root: {{.DockerRootDir}} | Storage driver: {{.Driver}}' || true
          docker system df || true
          echo "=========================================================="

      - name: Ookla Speedtest (optional)
        if: inputs.speedtest == true
        shell: bash
        timeout-minutes: 10
        run: |
          set -u
          report="$RUNNER_TEMP/dbai-speedtest.txt"
          error_log="$RUNNER_TEMP/dbai-speedtest-error.txt"
          result_json="$RUNNER_TEMP/dbai-speedtest-result.json"
          {
            echo "=== DBAI VM Network Speedtest ==="
            echo "Timestamp: $(date -Is)"
            echo "Runner: $(uname -n)"
            echo "OS: $(. /etc/os-release; echo "$PRETTY_NAME")"
            echo "Architecture: $(dpkg --print-architecture)"
          } | tee "$report"

          # Install the official Packagecloud .deb directly. This avoids APT
          # distribution metadata (the Ubuntu Noble Release URL returned 404).
          speedtest_version="1.2.0.84-1.ea6b6773cf"
          deb_arch="$(dpkg --print-architecture)"
          case "$deb_arch" in
            amd64)
              ookla_arch="amd64"
              expected_sha256="35e084567a6388631fb10cf01e5e0d6b57a67d34ede2b72ba111b3d9164c8b94"
              ;;
            arm64)
              ookla_arch="arm64"
              expected_sha256="98e7de9db3bf181d08bc67e647bcfc71349c8014e387289c08e54e5c55d82f37"
              ;;
            armhf)
              ookla_arch="armhf"
              expected_sha256="f00c46b4945e3e1fea08e4858db78c9d8f3e35a8c9daa4c033df7eb03931294d"
              ;;
            i386)
              ookla_arch="i386"
              expected_sha256="dbd946d2cf174507e0efc8baa576aba366ca4e0b523276c287f0753df058faa5"
              ;;
            *)
              echo "No pinned official Ookla .deb/checksum for dpkg architecture '$deb_arch'; skipping Speedtest safely." | tee -a "$report"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          package_name="speedtest_${speedtest_version}_${ookla_arch}.deb"
          package_url="https://packagecloud.io/ookla/speedtest-cli/packages/debian/bookworm/${package_name}/download.deb?distro_version_id=215"
          package_file="$RUNNER_TEMP/$package_name"
          echo "Downloading official Ookla package for architecture $ookla_arch..."
          if ! curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --output "$package_file" "$package_url"; then
            echo "Speedtest .deb download failed; continuing build without speed measurements." | tee -a "$report"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          actual_sha256="$(sha256sum "$package_file" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$expected_sha256" ]]; then
            echo "Speedtest .deb SHA-256 mismatch; refusing to install it. Expected $expected_sha256, got $actual_sha256." | tee -a "$report"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Package SHA-256 verified: $actual_sha256" | tee -a "$report"

          if ! sudo apt-get install -y "$package_file"; then
            echo "Speedtest .deb installation failed; continuing build without speed measurements." | tee -a "$report"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          set +e
          timeout 120s speedtest --accept-license --accept-gdpr --format=json > "$result_json" 2> "$error_log"
          speedtest_status=$?
          set -e
          if [[ "$speedtest_status" -ne 0 ]]; then
            echo "Speedtest could not complete (exit code $speedtest_status); this is non-fatal and the image build will continue." | tee -a "$report"
            if [[ -s "$error_log" ]]; then
              cat "$error_log" | tee -a "$report"
            fi
          else
            if ! python3 - "$result_json" >> "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          def mbps(section):
              bandwidth = data.get(section, {}).get("bandwidth")
              return "unavailable" if bandwidth is None else f"{float(bandwidth) * 8 / 1_000_000:.2f} Mbps"

          ping = data.get("ping", {}).get("latency")
          server = data.get("server", {})
          print("Result: SUCCESS")
          print(f"ISP: {data.get('isp', 'unavailable')}")
          print(f"Server: {server.get('name', 'unknown')} ({server.get('location', 'unknown')}, {server.get('country', 'unknown')})")
          print(f"Latency: {ping:.2f} ms" if isinstance(ping, (int, float)) else "Latency: unavailable")
          print(f"Download: {mbps('download')}")
          print(f"Upload: {mbps('upload')}")
          result = data.get("result", {}).get("url")
          if result:
              print(f"Result URL: {result}")
          PY
            then
              echo "Speedtest JSON parsing failed; continuing build without parsed measurements." | tee -a "$report"
            fi
          fi
          echo
          cat "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure custom extension directory exists
        shell: bash
        run: |
          mkdir -p userpatches/extensions
          touch userpatches/extensions/.gitkeep

      - name: Check custom board configuration
        run: |
          test -f config/boards/aml-s9xx-box.tvb || {
            echo "::error::config/boards/aml-s9xx-box.tvb is missing. Commit the custom board file to this repository."
            exit 1
          }
          echo "Custom board configuration found."
          if [[ -d userpatches ]]; then
            echo "userpatches directory found."
          else
            echo "No userpatches directory in checkout; continuing."
          fi

      - name: Check Btrfs support on runner
        if: matrix.filesystem == 'btrfs'
        run: |
          sudo modprobe btrfs || true
          if [[ ! -d /sys/module/btrfs ]]; then
            echo "::error::The GitHub runner kernel does not expose Btrfs support; cannot run ROOTFS_TYPE=btrfs on this runner."
            exit 1
          fi
          echo "Btrfs kernel support is available."

      # Register QEMU/binfmt on the runner host so Docker can execute ARM64
      # userspace while the x86_64 GitHub runner builds the ARM64 rootfs.
      - name: Enable ARM64 emulation with QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Verify ARM64 container emulation
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing ARM64 container execution before starting Armbian build..."
          result="$(docker run --rm --platform linux/arm64 alpine:3.20 uname -m)"
          echo "ARM64 container reported architecture: $result"
          [[ "$result" == "aarch64" || "$result" == "arm64" ]] || {
            echo "::error::QEMU/binfmt verification failed; expected aarch64/arm64, got: $result"
            exit 1
          }
          echo "ARM64 emulation is ready."

      - name: Build Armbian image
        env:
          FS: ${{ matrix.filesystem }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
          RELEASE: ${{ matrix.release }}
          IMAGE_SIZE: ${{ matrix.image_size }}
          BUILD_DESKTOP: ${{ matrix.build_desktop }}
          BUILD_MINIMAL: ${{ matrix.build_minimal }}
          EXTENSION: ${{ matrix.extension }}
          DESKTOP_ENV: ${{ matrix.desktop_env }}
          BUILD_VERSION: ${{ needs.create_release.outputs.image_version }}
        run: |
          set -o pipefail
          # Avoid passing an empty terminal width into package maintainer scripts.
          export COLUMNS=80
          export LINES=24
          args=(
            "BOARD=aml-s9xx-box"
            "REVISION=${BUILD_VERSION}"
            "IMAGE_VERSION=${BUILD_VERSION}"
            "VENDOR=DBAI"
            "VENDORPRETTYNAME=Armbian-DBAI-2K26"
            "VENDORCOLOR=39;174;96"
            "VENDORURL=https://github.com/armarchindo/build"
            "VENDORDOCS=https://github.com/armarchindo/build#readme"
            "VENDORSUPPORT=https://github.com/armarchindo/build/issues"
            "VENDORBUGS=https://github.com/armarchindo/build/issues"
            "VENDORLOGO=armbian-logo"
            "MAINTAINER=DBAI Armbian Project"
            "MAINTAINERMAIL=dbai.media@gmail.com"
            "BOOTSIZE=256"
            "FIXED_IMAGE_SIZE=${IMAGE_SIZE}"
            "ROOTFS_TYPE=${FS}"
            "BSPFREEZE=yes"
            "BRANCH=current"
            "BUILD_DESKTOP=${BUILD_DESKTOP}"
            "BUILD_MINIMAL=${BUILD_MINIMAL}"
            "COMPRESS_OUTPUTIMAGE=sha,xz"
            "IMAGE_XZ_COMPRESSION_RATIO=0"
            "KERNEL_GIT=shallow"
            "KERNEL_CONFIGURE=no"
          )
          if [[ -n "$EXTENSION" ]]; then
            args+=("ENABLE_EXTENSIONS=dbai-branding,${EXTENSION}")
          else
            args+=("ENABLE_EXTENSIONS=dbai-branding")
          fi
          if [[ "$PROFILE" == "desktop" && -z "$EXTENSION" ]]; then
            args+=("DESKTOP_ENVIRONMENT=${DESKTOP_ENV}" "DESKTOP_TIER=minimal")
          fi
          args+=("RELEASE=${RELEASE}")

          printf 'Running: ./compile.sh build'
          printf ' %q' "${args[@]}"
          printf '\n'

          ./compile.sh build "${args[@]}" 2>&1 | tee "build-${FS}-${PROFILE}-${VARIANT}-${RELEASE}.log"

      - name: Prepare image and checksum for release
        if: success()
        env:
          FS: ${{ matrix.filesystem }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
          RELEASE: ${{ matrix.release }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t images < <(find output/images -maxdepth 1 -type f \( -name '*.img.xz' -o -name '*.img' \) -print | sort)
          if [[ "${#images[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one image in output/images, found ${#images[@]}."
            printf '%s\n' "${images[@]}"
            find output/images -maxdepth 1 -type f -print || true
            exit 1
          fi
          image="${images[0]}"

          # Verify the boot partition before publishing any image. The generic
          # Armbian XBOOTLDR code (0xEA) used to make Windows hide this board's
          # FAT boot partition; aml-s9xx-box must expose it as FAT32-LBA (0x0C).
          temp_raw=""
          loopdev=""
          cleanup_image_validation() {
            if [[ -n "$loopdev" ]]; then
              sudo losetup -d "$loopdev" >/dev/null 2>&1 || true
            fi
            if [[ -n "$temp_raw" ]]; then
              rm -f -- "$temp_raw"
            fi
          }
          trap cleanup_image_validation EXIT

          if [[ "$image" == *.img.xz ]]; then
            temp_raw="$(mktemp "$GITHUB_WORKSPACE/dbai-verify.XXXXXX.img")"
            echo "Decompressing image temporarily for partition-table QA..."
            xz --decompress --stdout -- "$image" > "$temp_raw"
            raw_image="$temp_raw"
          else
            raw_image="$image"
          fi

          partition_table_json="$(sfdisk --json "$raw_image")"
          boot_type="$(printf '%s' "$partition_table_json" | python3 -c '
          import json, sys
          table = json.load(sys.stdin)["partitiontable"]
          if table.get("label") not in {"dos", "msdos"}:
              raise SystemExit(f"Expected MBR/DOS partition table, got {table.get('label')!r}")
          partitions = table.get("partitions", [])
          if not partitions:
              raise SystemExit("The image has no partitions.")
          print(str(partitions[0].get("type", "")).lower().removeprefix("0x"))
          ')"
          if [[ "$boot_type" != "c" && "$boot_type" != "0c" ]]; then
            echo "::error::Boot partition has MBR type '$boot_type'; expected 0x0C (FAT32-LBA)."
            sfdisk --dump "$raw_image" || true
            exit 1
          fi
          echo "MBR boot partition type verified: 0x0C (FAT32-LBA)."

          loopdev="$(sudo losetup --find --show --partscan "$raw_image")"
          sudo udevadm settle
          boot_partition="${loopdev}p1"
          for attempt in {1..20}; do
            [[ -b "$boot_partition" ]] && break
            sleep 1
          done
          if [[ ! -b "$boot_partition" ]]; then
            echo "::error::Could not expose boot partition device ${boot_partition} for filesystem validation."
            exit 1
          fi
          boot_fs="$(sudo blkid -s TYPE -o value "$boot_partition" || true)"
          if [[ "$boot_fs" != "vfat" ]]; then
            echo "::error::Boot partition filesystem is '$boot_fs'; expected FAT/vfat for Windows accessibility."
            sudo blkid "$boot_partition" || true
            exit 1
          fi
          echo "Boot filesystem verified: $boot_fs"
          echo "Image partition QA passed. This check validates the partition table and FAT filesystem; it is not a full device boot test."
          {
            echo "### Image partition QA"
            echo "- MBR boot partition type: `0x0C` (FAT32-LBA)"
            echo "- Boot filesystem detected by blkid: `$boot_fs`"
            echo "- QA passed for `aml-s9xx-box-${FS}-${RELEASE}-${VARIANT}`."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$image" == *.img.xz ]]; then
            suffix="img.xz"
          else
            suffix="img"
          fi

          asset="aml-s9xx-box-${FS}-${RELEASE}-${VARIANT}.${suffix}"
          cp "$image" "dist/$asset"
          # The checksum must contain only the asset basename for portable verification.
          (cd dist && sha256sum "$asset" > "${asset}.sha256")
          ls -lh dist/

      - name: Upload image and checksum to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.create_release.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Remove local image files after successful upload
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- dist output/images
          echo "Local image files removed; Release assets remain available."

      - name: Show runner specs and remaining storage (AFTER BUILD)
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/dbai-after-build-report.txt"
          {
            echo "========== DBAI ARMBIAN BUILD: AFTER BUILD REPORT =========="
            date -Is
            echo "=== Runner OS ==="
            cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION_ID)=' || true
            uname -a
            echo "=== CPU ==="
            lscpu | grep -E '^(Architecture|CPU|Model name|CPU MHz|Thread|Core|Socket|Virtualization)' || true
            echo "=== RAM and swap ==="
            free -h
            swapon --show || true
            echo "=== Remaining disk space ==="
            df -h / || true
            df -h "$GITHUB_WORKSPACE" || true
            df -ih / || true
            echo "=== Docker storage ==="
            docker info --format 'Docker root: {{.DockerRootDir}} | Storage driver: {{.Driver}}' || true
            docker system df || true
            echo "=========================================================="
          } | tee "$report"

      - name: Upload build log as Actions artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ matrix.filesystem }}-${{ matrix.profile }}-${{ matrix.variant }}-${{ matrix.release }}
          path: |
            build-${{ matrix.filesystem }}-${{ matrix.profile }}-${{ matrix.variant }}-${{ matrix.release }}.log
            output/logs/*.log.ans
            ${{ runner.temp }}/dbai-after-build-report.txt
            ${{ runner.temp }}/dbai-speedtest.txt
          if-no-files-found: ignore
          retention-days: 7

  finalize_release:
    needs: [create_release, build]
    if: always() && inputs.cleanup_run_history != true && needs.create_release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.create_release.outputs.release_tag }}
    steps:
      - name: Consolidate per-image checksums (supports reruns)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "::error::Release tag output is empty."
            exit 1
          fi

          asset_names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          mapfile -t checksum_assets < <(printf '%s\n' "$asset_names" | grep -E '\.img(\.xz)?\.sha256$' || true)

          mkdir -p checksum-input
          # Preserve a previous consolidated list when a failed job is rerun later.
          if gh release download "$RELEASE_TAG" --pattern 'SHA256SUMS.txt' --dir checksum-input; then
            mv checksum-input/SHA256SUMS.txt checksum-input/existing-SHA256SUMS.txt
          fi

          # Download current per-image sidecars if any. These take precedence over older sums.
          if [[ "${#checksum_assets[@]}" -gt 0 ]]; then
            gh release download "$RELEASE_TAG" --pattern '*.sha256' --dir checksum-input
          fi

          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path("checksum-input")
          checksums = {}
          digest_re = re.compile(r"^[0-9a-fA-F]{64}$")

          def read_sum_file(path):
              for line in path.read_text(encoding="utf-8").splitlines():
                  parts = line.strip().split(maxsplit=1)
                  if len(parts) != 2:
                      continue
                  digest, filename = parts
                  filename = filename.lstrip("*")
                  filename = pathlib.PurePosixPath(filename).name
                  if digest_re.fullmatch(digest) and filename:
                      checksums[filename] = digest.lower()

          existing = root / "existing-SHA256SUMS.txt"
          if existing.is_file():
              read_sum_file(existing)

          for sidecar in sorted(root.glob("*.sha256")):
              read_sum_file(sidecar)

          if not checksums:
              print("No successful image checksum assets exist; no SHA256SUMS.txt will be published.")
          else:
              with open("SHA256SUMS.txt", "w", encoding="utf-8", newline="\n") as output:
                  for filename in sorted(checksums):
                      output.write(f"{checksums[filename]}  {filename}\n")
              print(f"Prepared {len(checksums)} checksum entries.")
          PY

          if [[ ! -s SHA256SUMS.txt ]]; then
            echo "No checksum entries to publish; leaving the release unchanged."
            exit 0
          fi

          echo "Combined checksums:"
          cat SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber

          # Remove individual sidecars only after the combined file uploads successfully.
          for asset in "${checksum_assets[@]}"; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done
          echo "Published SHA256SUMS.txt; removed ${#checksum_assets[@]} current sidecars."

  cleanup_workflow_history:
    if: inputs.cleanup_run_history == true
    name: Delete workflow run history
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - name: Permanently delete repository workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIRMATION: ${{ inputs.confirm_run_history_cleanup }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "DELETE ALL RUN HISTORY" ]]; then
            echo "::error::Cleanup not authorized. Set confirmation to 'DELETE ALL RUN HISTORY'. No run was deleted."
            exit 1
          fi
          repo="$GITHUB_REPOSITORY"
          current="$CURRENT_RUN_ID"
          mapfile -t run_ids < <(gh api --paginate "repos/$repo/actions/runs?per_page=100" --jq '.workflow_runs[].id' | sort -un)
          echo "Found ${#run_ids[@]} workflow runs. Deleting all runs except the current cleanup run."
          deleted=0
          failed=0
          for run_id in "${run_ids[@]}"; do
            [[ -n "$run_id" ]] || continue
            [[ "$run_id" == "$current" ]] && continue
            if gh api --silent --method DELETE "repos/$repo/actions/runs/$run_id"; then
              deleted=$((deleted + 1))
              echo "Deleted workflow run $run_id"
            else
              failed=$((failed + 1))
              echo "::warning::Could not delete workflow run $run_id"
            fi
            sleep 0.2
          done
          echo "Deleted $deleted prior workflow runs; failures: $failed."
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Some workflow runs may remain."
            exit 1
          fi
          echo "Current cleanup run intentionally retained; GitHub may not permit a running workflow to delete itself."
