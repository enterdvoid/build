name: DBAI Armbian Build

on:
  workflow_dispatch:
    inputs:
      filesystem:
        description: "Filesystem target"
        required: true
        type: choice
        default: ext4
        options:
          - ext4
          - btrfs
          - both
      all_build_types:
        description: "Build semua tipe firmware (mengabaikan checkbox lainnya)"
        required: true
        type: boolean
        default: false
      server:
        description: "Server: semua 6 release"
        required: true
        type: boolean
        default: false
      minimal:
        description: "Minimal: semua 6 release"
        required: true
        type: boolean
        default: false
      home_assistant:
        description: "Applications: Home Assistant (Trixie)"
        required: true
        type: boolean
        default: false
      openmediavault:
        description: "Applications: OpenMediaVault (Trixie)"
        required: true
        type: boolean
        default: false
      kali:
        description: "Applications: Kali (Trixie)"
        required: true
        type: boolean
        default: false
      docker_ce:
        description: "Applications: Docker CE (Trixie)"
        required: true
        type: boolean
        default: false
      all_desktops:
        description: "Build semua 11 desktop environment (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_xfce:
        description: "Desktop: XFCE (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_mate:
        description: "Desktop: MATE (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_gnome:
        description: "Desktop: GNOME (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_cinnamon:
        description: "Desktop: Cinnamon (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_kde_plasma:
        description: "Desktop: KDE Plasma (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_kde_neon:
        description: "Desktop: KDE Neon (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_i3_wm:
        description: "Desktop: i3-wm (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_enlightenment:
        description: "Desktop: Enlightenment (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_xmonad:
        description: "Desktop: Xmonad (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_budgie:
        description: "Desktop: Budgie (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_deepin:
        description: "Desktop: Deepin (Trixie)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dbai-armbian-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: matrix
        env:
          FILESYSTEM_INPUT: ${{ inputs.filesystem }}
          ALL_BUILD_TYPES: ${{ inputs.all_build_types }}
          SERVER: ${{ inputs.server }}
          MINIMAL: ${{ inputs.minimal }}
          HOME_ASSISTANT: ${{ inputs.home_assistant }}
          OPENMEDIAVAULT: ${{ inputs.openmediavault }}
          KALI: ${{ inputs.kali }}
          DOCKER_CE: ${{ inputs.docker_ce }}
          ALL_DESKTOPS: ${{ inputs.all_desktops }}
          DESKTOP_XFCE: ${{ inputs.desktop_xfce }}
          DESKTOP_MATE: ${{ inputs.desktop_mate }}
          DESKTOP_GNOME: ${{ inputs.desktop_gnome }}
          DESKTOP_CINNAMON: ${{ inputs.desktop_cinnamon }}
          DESKTOP_KDE_PLASMA: ${{ inputs.desktop_kde_plasma }}
          DESKTOP_KDE_NEON: ${{ inputs.desktop_kde_neon }}
          DESKTOP_I3_WM: ${{ inputs.desktop_i3_wm }}
          DESKTOP_ENLIGHTENMENT: ${{ inputs.desktop_enlightenment }}
          DESKTOP_XMONAD: ${{ inputs.desktop_xmonad }}
          DESKTOP_BUDGIE: ${{ inputs.desktop_budgie }}
          DESKTOP_DEEPIN: ${{ inputs.desktop_deepin }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          releases = ["bookworm", "trixie", "forky", "jammy", "noble", "resolute"]
          filesystems = ["ext4", "btrfs"] if os.environ["FILESYSTEM_INPUT"] == "both" else [os.environ["FILESYSTEM_INPUT"]]
          truthy = lambda name: os.environ.get(name, "false").lower() == "true"
          all_types = truthy("ALL_BUILD_TYPES")

          selected = {
              "server": all_types or truthy("SERVER"),
              "minimal": all_types or truthy("MINIMAL"),
          }
          app_variants = [
              ("home-assistant", "applications-ha", "HOME_ASSISTANT"),
              ("openmediavault", "applications-omv", "OPENMEDIAVAULT"),
              ("kali", "applications-kali", "KALI"),
              ("docker-ce", "docker-ce", "DOCKER_CE"),
          ]
          desktop_variants = [
              ("xfce", "DESKTOP_XFCE"), ("mate", "DESKTOP_MATE"),
              ("gnome", "DESKTOP_GNOME"), ("cinnamon", "DESKTOP_CINNAMON"),
              ("kde-plasma", "DESKTOP_KDE_PLASMA"), ("kde-neon", "DESKTOP_KDE_NEON"),
              ("i3-wm", "DESKTOP_I3_WM"), ("enlightenment", "DESKTOP_ENLIGHTENMENT"),
              ("xmonad", "DESKTOP_XMONAD"), ("budgie", "DESKTOP_BUDGIE"),
              ("deepin", "DESKTOP_DEEPIN"),
          ]
          selected_apps = [(v, e) for v, e, key in app_variants if all_types or truthy(key)]
          selected_desktops = [v for v, key in desktop_variants if all_types or truthy("ALL_DESKTOPS") or truthy(key)]

          matrix = []
          for fs in filesystems:
              for profile in ("server", "minimal"):
                  if not selected[profile]:
                      continue
                  for release in releases:
                      matrix.append({
                          "filesystem": fs, "profile": profile, "variant": profile,
                          "release": release, "image_size": 4096,
                          "build_desktop": "no", "build_minimal": "yes" if profile == "minimal" else "no",
                          "extension": "", "desktop_env": ""
                      })
              for variant, extension in selected_apps:
                  matrix.append({
                      "filesystem": fs, "profile": "applications", "variant": variant,
                      "release": "trixie", "image_size": 8192,
                      "build_desktop": "no", "build_minimal": "no",
                      "extension": extension, "desktop_env": ""
                  })
              for desktop in selected_desktops:
                  matrix.append({
                      "filesystem": fs, "profile": "desktop", "variant": desktop,
                      "release": "trixie", "image_size": 8192,
                      "build_desktop": "yes", "build_minimal": "no",
                      "extension": "", "desktop_env": desktop
                  })

          if not matrix:
              raise SystemExit("Tidak ada build yang dipilih. Centang minimal satu tipe build atau 'Build semua tipe firmware'.")
          print("matrix=" + json.dumps({"include": matrix}, separators=(",", ":")))
          print("count=" + str(len(matrix)))
          PY
      - name: Show selected matrix
        env:
          FILESYSTEM_INPUT: ${{ inputs.filesystem }}
          ALL_BUILD_TYPES: ${{ inputs.all_build_types }}
        run: |
          echo "Filesystem: $FILESYSTEM_INPUT"
          echo "Build all types: $ALL_BUILD_TYPES"
          echo "Build matrix generated."

  create_release:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Create descriptive release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
          FILESYSTEM_INPUT: ${{ inputs.filesystem }}
          ALL_BUILD_TYPES: ${{ inputs.all_build_types }}
          SERVER: ${{ inputs.server }}
          MINIMAL: ${{ inputs.minimal }}
          HOME_ASSISTANT: ${{ inputs.home_assistant }}
          OPENMEDIAVAULT: ${{ inputs.openmediavault }}
          KALI: ${{ inputs.kali }}
          DOCKER_CE: ${{ inputs.docker_ce }}
          ALL_DESKTOPS: ${{ inputs.all_desktops }}
          DESKTOP_XFCE: ${{ inputs.desktop_xfce }}
          DESKTOP_MATE: ${{ inputs.desktop_mate }}
          DESKTOP_GNOME: ${{ inputs.desktop_gnome }}
          DESKTOP_CINNAMON: ${{ inputs.desktop_cinnamon }}
          DESKTOP_KDE_PLASMA: ${{ inputs.desktop_kde_plasma }}
          DESKTOP_KDE_NEON: ${{ inputs.desktop_kde_neon }}
          DESKTOP_I3_WM: ${{ inputs.desktop_i3_wm }}
          DESKTOP_ENLIGHTENMENT: ${{ inputs.desktop_enlightenment }}
          DESKTOP_XMONAD: ${{ inputs.desktop_xmonad }}
          DESKTOP_BUDGIE: ${{ inputs.desktop_budgie }}
          DESKTOP_DEEPIN: ${{ inputs.desktop_deepin }}
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(TZ=Asia/Jakarta date -d "$RUN_STARTED_AT" +'%Y-%m-%d_%H-%M')"
          tag="dbai-armbian-build-${RUN_ID}"
          release_title="DBAI Armbian Build ${stamp}"
          notes_file="release-summary.md"
          {
            echo '# DBAI Armbian Build'
            echo
            echo "**Workflow started (Asia/Jakarta): ${stamp}**"
            echo
            echo '## Build selection'
            echo
            echo "- **Filesystem target:** ${FILESYSTEM_INPUT}"
            if [[ "$ALL_BUILD_TYPES" == "true" ]]; then
              echo '- **Server:** all configured releases (Bookworm, Trixie, Forky, Jammy, Noble, Resolute)'
              echo '- **Minimal:** all configured releases (Bookworm, Trixie, Forky, Jammy, Noble, Resolute)'
              echo '- **Applications:** Home Assistant, OpenMediaVault, Kali, Docker CE (Trixie)'
              echo '- **Desktop:** all 11 desktop environments (Trixie)'
            else
              if [[ "$SERVER" == "true" ]]; then echo '- **Server:** Bookworm, Trixie, Forky, Jammy, Noble, Resolute'; fi
              if [[ "$MINIMAL" == "true" ]]; then echo '- **Minimal:** Bookworm, Trixie, Forky, Jammy, Noble, Resolute'; fi
              if [[ "$HOME_ASSISTANT" == "true" ]]; then echo '- **Application:** Home Assistant (Trixie)'; fi
              if [[ "$OPENMEDIAVAULT" == "true" ]]; then echo '- **Application:** OpenMediaVault (Trixie)'; fi
              if [[ "$KALI" == "true" ]]; then echo '- **Application:** Kali (Trixie)'; fi
              if [[ "$DOCKER_CE" == "true" ]]; then echo '- **Application:** Docker CE (Trixie)'; fi
              if [[ "$ALL_DESKTOPS" == "true" ]]; then
                echo '- **Desktop:** all 11 desktop environments (Trixie)'
              else
                if [[ "$DESKTOP_XFCE" == "true" ]]; then echo '- **Desktop:** XFCE (Trixie)'; fi
                if [[ "$DESKTOP_MATE" == "true" ]]; then echo '- **Desktop:** MATE (Trixie)'; fi
                if [[ "$DESKTOP_GNOME" == "true" ]]; then echo '- **Desktop:** GNOME (Trixie)'; fi
                if [[ "$DESKTOP_CINNAMON" == "true" ]]; then echo '- **Desktop:** Cinnamon (Trixie)'; fi
                if [[ "$DESKTOP_KDE_PLASMA" == "true" ]]; then echo '- **Desktop:** KDE Plasma (Trixie)'; fi
                if [[ "$DESKTOP_KDE_NEON" == "true" ]]; then echo '- **Desktop:** KDE Neon (Trixie)'; fi
                if [[ "$DESKTOP_I3_WM" == "true" ]]; then echo '- **Desktop:** i3-wm (Trixie)'; fi
                if [[ "$DESKTOP_ENLIGHTENMENT" == "true" ]]; then echo '- **Desktop:** Enlightenment (Trixie)'; fi
                if [[ "$DESKTOP_XMONAD" == "true" ]]; then echo '- **Desktop:** Xmonad (Trixie)'; fi
                if [[ "$DESKTOP_BUDGIE" == "true" ]]; then echo '- **Desktop:** Budgie (Trixie)'; fi
                if [[ "$DESKTOP_DEEPIN" == "true" ]]; then echo '- **Desktop:** Deepin (Trixie)'; fi
              fi
            fi
            echo
            echo '## Common image parameters'
            echo
            echo '- **Board:** `aml-s9xx-box`'
            echo '- **Kernel branch:** `current`'
            echo '- **Boot partition request:** 256 MiB'
            echo '- **Requested raw image size:** Server/Minimal 4096 MiB; Applications/Desktop 8192 MiB'
            echo '- **Image output:** compressed XZ when produced by Armbian Builder, with SHA-256 checksum'
            echo
            echo '## Notes'
            echo
            echo '- This section documents the selected build matrix. Only successful jobs upload image and checksum assets.'
            echo '- Requested raw image size is not the compressed download file size.'
            echo '- Actual image filenames and compressed sizes are shown in the Release assets list.'
            echo
            echo "[Open GitHub Actions run](https://github.com/${GH_REPO}/actions/runs/${RUN_ID})"
          } > "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$release_title" --notes-file "$notes_file" --prerelease --latest=false
          else
            gh release create "$tag" --title "$release_title" --notes-file "$notes_file" --prerelease --latest=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: [prepare, create_release]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.filesystem }} / ${{ matrix.profile }} / ${{ matrix.variant }} / ${{ matrix.release }}
    steps:
      - name: Maximize available build disk
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout Armbian builder and local customizations
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # maximize-build-space gives the workspace a large dedicated volume, but
      # Docker normally stores layers under /var/lib/docker on the nearly-full root.
      # Move Docker's fresh data root onto the workspace volume before pulling/building.
      - name: Move Docker storage to large build volume
        shell: bash
        run: |
          set -euo pipefail
          docker_root="$GITHUB_WORKSPACE/.docker-data"
          echo "Docker data root will be: $docker_root"
          # Keep Docker's layers on the large workspace filesystem, but tell Git not to scan this root-owned data directory.
          exclude_file="$GITHUB_WORKSPACE/.git/info/exclude"
          grep -qxF '/.docker-data/' "$exclude_file" || printf '\n/.docker-data/\n' >> "$exclude_file"
          sudo systemctl stop docker.socket docker.service || true
          sudo mkdir -p "$docker_root"
          sudo chown root:root "$docker_root"
          sudo python3 - "$docker_root" <<'PY'
          import json, os, sys
          path = "/etc/docker/daemon.json"
          try:
              with open(path, encoding="utf-8") as f:
                  config = json.load(f)
          except FileNotFoundError:
              config = {}
          config["data-root"] = sys.argv[1]
          tmp = path + ".tmp"
          with open(tmp, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          os.replace(tmp, path)
          PY
          sudo systemctl start docker
          for i in {1..30}; do
            if docker info >/dev/null 2>&1; then break; fi
            sleep 2
          done
          actual_root="$(docker info --format '{{.DockerRootDir}}')"
          echo "DockerRootDir=$actual_root"
          [[ "$actual_root" == "$docker_root" ]] || {
            echo "::error::Docker did not switch to the large workspace volume."
            exit 1
          }
          echo "=== Filesystem containing Docker data root ==="
          df -h "$docker_root"
          df -h "$GITHUB_WORKSPACE"

      - name: Show runner specs and selected build configuration
        env:
          FS: ${{ matrix.filesystem }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
          RELEASE: ${{ matrix.release }}
          IMAGE_SIZE: ${{ matrix.image_size }}
          BUILD_DESKTOP: ${{ matrix.build_desktop }}
          BUILD_MINIMAL: ${{ matrix.build_minimal }}
          EXTENSION: ${{ matrix.extension }}
          DESKTOP_ENV: ${{ matrix.desktop_env }}
        run: |
          echo "========== DBAI ARMBIAN BUILD: PRE-BUILD REPORT =========="
          echo "=== Selected build ==="
          echo "Board: aml-s9xx-box"
          echo "Filesystem: $FS"
          echo "Profile / variant: $PROFILE / $VARIANT"
          echo "Release: $RELEASE"
          echo "Image size: ${IMAGE_SIZE} MiB"
          echo "BUILD_DESKTOP=$BUILD_DESKTOP"
          echo "BUILD_MINIMAL=$BUILD_MINIMAL"
          echo "Extension: ${EXTENSION:-none}"
          echo "Desktop environment: ${DESKTOP_ENV:-none}"
          echo "=== Runner OS ==="
          cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION_ID)=' || true
          uname -a
          echo "=== CPU ==="
          lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|CPU MHz|Thread|Core|Socket|Virtualization):' || true
          echo "=== RAM and swap ==="
          free -h
          swapon --show || true
          echo "=== Disk space ==="
          df -h /
          df -h "$GITHUB_WORKSPACE"
          df -ih /
          echo "=== Docker ==="
          docker --version
          docker info --format 'Docker root: {{.DockerRootDir}} | Storage driver: {{.Driver}}' || true
          docker system df || true
          echo "=========================================================="

      - name: Ensure custom extension directory exists
        shell: bash
        run: |
          mkdir -p userpatches/extensions
          touch userpatches/extensions/.gitkeep

      - name: Check custom board configuration
        run: |
          test -f config/boards/aml-s9xx-box.tvb || {
            echo "::error::config/boards/aml-s9xx-box.tvb is missing. Commit the custom board file to this repository."
            exit 1
          }
          echo "Custom board configuration found."
          if [[ -d userpatches ]]; then
            echo "userpatches directory found."
          else
            echo "No userpatches directory in checkout; continuing."
          fi

      - name: Check Btrfs support on runner
        if: matrix.filesystem == 'btrfs'
        run: |
          sudo modprobe btrfs || true
          if [[ ! -d /sys/module/btrfs ]]; then
            echo "::error::The GitHub runner kernel does not expose Btrfs support; cannot run ROOTFS_TYPE=btrfs on this runner."
            exit 1
          fi
          echo "Btrfs kernel support is available."

      # Register QEMU/binfmt on the runner host so Docker can execute ARM64
      # userspace while the x86_64 GitHub runner builds the ARM64 rootfs.
      - name: Enable ARM64 emulation with QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Verify ARM64 container emulation
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing ARM64 container execution before starting Armbian build..."
          result="$(docker run --rm --platform linux/arm64 alpine:3.20 uname -m)"
          echo "ARM64 container reported architecture: $result"
          [[ "$result" == "aarch64" || "$result" == "arm64" ]] || {
            echo "::error::QEMU/binfmt verification failed; expected aarch64/arm64, got: $result"
            exit 1
          }
          echo "ARM64 emulation is ready."

      - name: Build Armbian image
        env:
          FS: ${{ matrix.filesystem }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
          RELEASE: ${{ matrix.release }}
          IMAGE_SIZE: ${{ matrix.image_size }}
          BUILD_DESKTOP: ${{ matrix.build_desktop }}
          BUILD_MINIMAL: ${{ matrix.build_minimal }}
          EXTENSION: ${{ matrix.extension }}
          DESKTOP_ENV: ${{ matrix.desktop_env }}
        run: |
          set -o pipefail
          args=(
            "BOARD=aml-s9xx-box"
            "BOOTSIZE=256"
            "FIXED_IMAGE_SIZE=${IMAGE_SIZE}"
            "ROOTFS_TYPE=${FS}"
            "BRANCH=current"
            "BUILD_DESKTOP=${BUILD_DESKTOP}"
            "BUILD_MINIMAL=${BUILD_MINIMAL}"
            "COMPRESS_OUTPUTIMAGE=sha,xz"
            "IMAGE_XZ_COMPRESSION_RATIO=0"
            "KERNEL_GIT=shallow"
          )

          # Preserve the user's original options: KERNEL_CONFIGURE=no for
          # server, minimal, and application builds; desktop commands omit it.
          if [[ "$PROFILE" != "desktop" ]]; then
            args+=("KERNEL_CONFIGURE=no")
          fi
          if [[ -n "$EXTENSION" ]]; then
            args+=("ENABLE_EXTENSIONS=${EXTENSION}")
          fi
          if [[ "$PROFILE" == "desktop" ]]; then
            args+=("DESKTOP_ENVIRONMENT=${DESKTOP_ENV}" "DESKTOP_TIER=minimal")
          fi
          args+=("RELEASE=${RELEASE}")

          printf 'Running: ./compile.sh build'
          printf ' %q' "${args[@]}"
          printf '\n'

          ./compile.sh build "${args[@]}" 2>&1 | tee "build-${FS}-${PROFILE}-${VARIANT}-${RELEASE}.log"

      - name: Prepare image and checksum for release
        if: success()
        env:
          FS: ${{ matrix.filesystem }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
          RELEASE: ${{ matrix.release }}
        run: |
          set -euo pipefail
          mkdir -p dist
          image="$(find output/images -maxdepth 1 -type f \( -name '*.img.xz' -o -name '*.img' \) -print -quit)"
          if [[ -z "$image" ]]; then
            echo "::error::No .img.xz or .img file found in output/images."
            find output/images -maxdepth 1 -type f -print || true
            exit 1
          fi

          if [[ "$image" == *.img.xz ]]; then
            suffix="img.xz"
          else
            suffix="img"
          fi

          asset="aml-s9xx-box-${FS}-${RELEASE}-${PROFILE}-${VARIANT}.${suffix}"
          cp "$image" "dist/$asset"
          sha256sum "dist/$asset" > "dist/${asset}.sha256"
          ls -lh dist/

      - name: Upload image and checksum to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.create_release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Show runner specs and remaining storage (AFTER BUILD)
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/dbai-after-build-report.txt"
          {
            echo "========== DBAI ARMBIAN BUILD: AFTER BUILD REPORT =========="
            date -Is
            echo "=== Runner OS ==="
            cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION_ID)=' || true
            uname -a
            echo "=== CPU ==="
            lscpu | grep -E '^(Architecture|CPU|Model name|CPU MHz|Thread|Core|Socket|Virtualization)' || true
            echo "=== RAM and swap ==="
            free -h
            swapon --show || true
            echo "=== Remaining disk space ==="
            df -h / || true
            df -h "$GITHUB_WORKSPACE" || true
            df -ih / || true
            echo "=== Docker storage ==="
            docker info --format 'Docker root: {{.DockerRootDir}} | Storage driver: {{.Driver}}' || true
            docker system df || true
            echo "=========================================================="
          } | tee "$report"

      - name: Upload build log as Actions artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ matrix.filesystem }}-${{ matrix.profile }}-${{ matrix.variant }}-${{ matrix.release }}
          path: |
            build-${{ matrix.filesystem }}-${{ matrix.profile }}-${{ matrix.variant }}-${{ matrix.release }}.log
            output/logs/*.log.ans
            ${{ runner.temp }}/dbai-after-build-report.txt
          if-no-files-found: ignore
          retention-days: 7
