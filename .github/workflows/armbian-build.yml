name: DBAI Armbian Build

on:
  workflow_dispatch:
    inputs:
      filesystem:
        description: "Filesystem untuk semua image yang dipilih"
        required: true
        type: choice
        default: both
        options:
          - both
          - ext4
          - btrfs
      os_group:
        description: "Semua OS, keluarga Debian/Ubuntu, atau satu release spesifik"
        required: true
        type: choice
        default: all
        options:
          - all
          - debian
          - ubuntu
          - bookworm
          - trixie
          - forky
          - jammy
          - noble
          - resolute
      cleanup_run_history:
        description: "HAPUS permanen seluruh riwayat workflow run di repository (tidak membangun image)"
        required: true
        type: boolean
        default: false
      confirm_run_history_cleanup:
        description: "Wajib pilih DELETE ALL RUN HISTORY untuk menjalankan penghapusan"
        required: true
        type: choice
        default: NO
        options:
          - NO
          - DELETE ALL RUN HISTORY
      server:
        description: "Server: semua release dalam kelompok OS terpilih"
        required: true
        type: boolean
        default: true
      minimal:
        description: "Minimal: semua release dalam kelompok OS terpilih"
        required: true
        type: boolean
        default: true
      applications:
        description: "Applications: semua aplikasi yang kompatibel dengan OS terpilih"
        required: true
        type: boolean
        default: true
      home_assistant:
        description: "Application: Home Assistant (Bookworm/Trixie)"
        required: true
        type: boolean
        default: false
      openmediavault:
        description: "Application: OpenMediaVault (Bookworm/Trixie)"
        required: true
        type: boolean
        default: false
      kali:
        description: "Application: Kali (Debian: Bookworm/Trixie/Forky)"
        required: true
        type: boolean
        default: false
      docker_ce:
        description: "Application: Docker CE (Bookworm/Trixie/Jammy/Noble/Resolute)"
        required: true
        type: boolean
        default: false
      desktop:
        description: "Desktop: semua environment yang tersedia pada OS terpilih"
        required: true
        type: boolean
        default: true
      desktop_xfce:
        description: "Desktop: XFCE pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_mate:
        description: "Desktop: MATE pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_gnome:
        description: "Desktop: GNOME pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_cinnamon:
        description: "Desktop: Cinnamon pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_kde_plasma:
        description: "Desktop: KDE Plasma pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_lxqt:
        description: "Desktop: LXQt pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_i3_wm:
        description: "Desktop: i3-wm pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_enlightenment:
        description: "Desktop: Enlightenment pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false
      desktop_budgie:
        description: "Desktop: Budgie pada release OS yang kompatibel"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dbai-armbian-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.cleanup_run_history != true
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: matrix
        env:
          FILESYSTEM_INPUT: ${{ inputs.filesystem }}
          OS_GROUP_INPUT: ${{ inputs.os_group }}
          SERVER: ${{ inputs.server }}
          MINIMAL: ${{ inputs.minimal }}
          APPLICATIONS: ${{ inputs.applications }}
          HOME_ASSISTANT: ${{ inputs.home_assistant }}
          OPENMEDIAVAULT: ${{ inputs.openmediavault }}
          KALI: ${{ inputs.kali }}
          DOCKER_CE: ${{ inputs.docker_ce }}
          DESKTOP: ${{ inputs.desktop }}
          DESKTOP_XFCE: ${{ inputs.desktop_xfce }}
          DESKTOP_MATE: ${{ inputs.desktop_mate }}
          DESKTOP_GNOME: ${{ inputs.desktop_gnome }}
          DESKTOP_CINNAMON: ${{ inputs.desktop_cinnamon }}
          DESKTOP_KDE_PLASMA: ${{ inputs.desktop_kde_plasma }}
          DESKTOP_I3_WM: ${{ inputs.desktop_i3_wm }}
          DESKTOP_ENLIGHTENMENT: ${{ inputs.desktop_enlightenment }}
          DESKTOP_BUDGIE: ${{ inputs.desktop_budgie }}
          DESKTOP_LXQT: ${{ inputs.desktop_lxqt }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys

          release_groups = {
              "all": ["bookworm", "trixie", "forky", "jammy", "noble", "resolute"],
              "debian": ["bookworm", "trixie", "forky"],
              "ubuntu": ["jammy", "noble", "resolute"],
              "bookworm": ["bookworm"],
              "trixie": ["trixie"],
              "forky": ["forky"],
              "jammy": ["jammy"],
              "noble": ["noble"],
              "resolute": ["resolute"],
          }
          release_group = os.environ.get("OS_GROUP_INPUT", "all").lower()
          if release_group not in release_groups:
              raise SystemExit(f"Unknown OS group: {release_group}")
          releases = release_groups[release_group]

          filesystem_input = os.environ.get("FILESYSTEM_INPUT", "both").lower()
          filesystems = ["ext4", "btrfs"] if filesystem_input == "both" else [filesystem_input]
          if any(fs not in ("ext4", "btrfs") for fs in filesystems):
              raise SystemExit(f"Invalid filesystem selection: {filesystem_input}")

          truthy = lambda name: os.environ.get(name, "false").lower() == "true"
          selected = {
              "server": truthy("SERVER"),
              "minimal": truthy("MINIMAL"),
          }

          # App support is explicit so an "all applications" run only creates compatible combinations.
          app_variants = [
              ("home-assistant", "applications-ha", "HOME_ASSISTANT", {"bookworm", "trixie"}),
              ("openmediavault", "applications-omv", "OPENMEDIAVAULT", {"bookworm", "trixie"}),
              ("kali", "applications-kali", "KALI", {"bookworm", "trixie", "forky"}),
              ("docker-ce", "docker-ce", "DOCKER_CE", {"bookworm", "trixie", "jammy", "noble", "resolute"}),
          ]
          select_all_apps = truthy("APPLICATIONS")
          selected_apps = [
              (variant, extension, supported_releases)
              for variant, extension, key, supported_releases in app_variants
              if select_all_apps or truthy(key)
          ]

          # Audited against armbian/configng desktop YAML: releases with ARM64 availability.
          # Supported and community variants are included; disabled/unsupported variants are excluded.
          desktop_variants = [
              ("xfce", "DESKTOP_XFCE", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("mate", "DESKTOP_MATE", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("gnome", "DESKTOP_GNOME", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("cinnamon", "DESKTOP_CINNAMON", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("kde-plasma", "DESKTOP_KDE_PLASMA", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("i3-wm", "DESKTOP_I3_WM", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("enlightenment", "DESKTOP_ENLIGHTENMENT", {"bookworm", "trixie", "forky", "jammy", "noble", "resolute"}),
              ("budgie", "DESKTOP_BUDGIE", {"bookworm", "trixie", "noble"}),
              ("lxqt", "DESKTOP_LXQT", {"bookworm", "trixie", "forky", "jammy", "noble"}),
          ]
          selected_desktops = [
              (variant, supported_releases)
              for variant, key, supported_releases in desktop_variants
              if truthy("DESKTOP") or truthy(key)
          ]

          matrix = []
          for fs in filesystems:
              for profile in ("server", "minimal"):
                  if not selected[profile]:
                      continue
                  for release in releases:
                      matrix.append({
                          "filesystem": fs, "profile": profile, "variant": profile,
                          "release": release, "image_size": 4096,
                          "build_desktop": "no",
                          "build_minimal": "yes" if profile == "minimal" else "no",
                          "extension": "", "desktop_env": ""
                      })

              for variant, extension, supported_releases in selected_apps:
                  for release in releases:
                      if release not in supported_releases:
                          continue
                      matrix.append({
                          "filesystem": fs, "profile": "applications", "variant": variant,
                          "release": release, "image_size": 8192,
                          "build_desktop": "no", "build_minimal": "no",
                          "extension": extension, "desktop_env": ""
                      })

              for desktop, supported_releases in selected_desktops:
                  for release in releases:
                      if release not in supported_releases:
                          continue
                      matrix.append({
                          "filesystem": fs, "profile": "desktop", "variant": desktop,
                          "release": release, "image_size": 8192,
                          "build_desktop": "yes", "build_minimal": "no",
                          "extension": "", "desktop_env": desktop
                      })

          full_matrix_count = len(matrix)
          print(f"Full selected matrix: {full_matrix_count} jobs for OS group '{release_group}' and filesystem(s): {', '.join(filesystems)}", file=sys.stderr)
          if not matrix:
              raise SystemExit("Tidak ada build yang dipilih. Pilih satu atau beberapa profil image.")
          if len(matrix) > 256:
              raise SystemExit(f"Matriks menghasilkan {len(matrix)} job; batas GitHub Actions adalah 256.")

          matrix_keys = [
              (item["filesystem"], item["release"], item["profile"], item["variant"])
              for item in matrix
          ]
          if len(set(matrix_keys)) != len(matrix_keys):
              raise SystemExit("Matriks mengandung kombinasi build duplikat.")

          if (
              release_group == "all"
              and filesystem_input == "both"
              and selected["server"]
              and selected["minimal"]
              and select_all_apps
              and truthy("DESKTOP")
          ):
              expected_default_jobs = 148
              if len(matrix) != expected_default_jobs:
                  raise SystemExit(
                      f"Default full matrix changed unexpectedly: expected {expected_default_jobs} jobs, got {len(matrix)}."
                  )

          # Put a compact, OS-by-OS inventory in the Actions run summary.
          from collections import Counter
          counts = Counter((item["release"], item["filesystem"], item["profile"]) for item in matrix)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("# DBAI Armbian build matrix\n\n")
                  summary.write(f"**Total jobs:** {full_matrix_count}  \n")
                  summary.write(f"**OS group:** {release_group}  \n")
                  summary.write(f"**Filesystems:** {', '.join(filesystems)}\n\n")
                  summary.write("| OS release | Filesystem | Server | Minimal | Applications | Desktop | Total |\n")
                  summary.write("|---|---|---:|---:|---:|---:|---:|\n")
                  for release in releases:
                      for fs in filesystems:
                          row = [counts.get((release, fs, profile), 0) for profile in ("server", "minimal", "applications", "desktop")]
                          summary.write(f"| {release} | {fs} | {row[0]} | {row[1]} | {row[2]} | {row[3]} | {sum(row)} |\n")

          print(f"Jobs submitted to GitHub Actions: {len(matrix)}", file=sys.stderr)
          print("matrix=" + json.dumps({"include": matrix}, separators=(",", ":")))
          print("count=" + str(len(matrix)))
          PY
      - name: Show selected matrix
        env:
          FILESYSTEM_INPUT: ${{ inputs.filesystem }}
          OS_GROUP_INPUT: ${{ inputs.os_group }}
          SERVER: ${{ inputs.server }}
          MINIMAL: ${{ inputs.minimal }}
          APPLICATIONS: ${{ inputs.applications }}
          DESKTOP: ${{ inputs.desktop }}
        run: |
          echo "Filesystem(s): $FILESYSTEM_INPUT"
          echo "OS release group: $OS_GROUP_INPUT"
          echo "Profile groups: server=$SERVER minimal=$MINIMAL applications=$APPLICATIONS desktop=$DESKTOP"
          echo "Build matrix generated."

  create_release:
    if: inputs.cleanup_run_history != true
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_title: ${{ steps.release.outputs.release_title }}
    steps:
      - name: Checkout and validate release prerequisites
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Check board and selected application extensions
        env:
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
        shell: bash
        run: |
          set -euo pipefail
          test -x ./compile.sh || { echo "::error::compile.sh is missing or not executable."; exit 1; }
          test -f config/boards/aml-s9xx-box.tvb || { echo "::error::config/boards/aml-s9xx-box.tvb is missing."; exit 1; }
          python3 - <<'PY'
          import json, os, pathlib
          matrix = json.loads(os.environ["MATRIX_JSON"])
          extension_by_variant = {
              "home-assistant": "applications-ha",
              "openmediavault": "applications-omv",
              "kali": "applications-kali",
              "docker-ce": "docker-ce",
          }
          root = pathlib.Path(".")
          app_rows = [row for row in matrix.get("include", []) if row.get("profile") == "applications"]
          for row in app_rows:
              variant = row.get("variant")
              extension = extension_by_variant.get(variant)
              if not extension:
                  raise SystemExit(f"Unknown application variant in matrix: {variant!r}")
              candidates = (
                  root / "extensions" / f"{extension}.sh",
                  root / "extensions" / extension / f"{extension}.sh",
                  root / "userpatches" / "extensions" / f"{extension}.sh",
                  root / "userpatches" / "extensions" / extension / f"{extension}.sh",
              )
              if not any(path.is_file() for path in candidates):
                  raise SystemExit(f"Required Armbian extension '{extension}' not found for variant '{variant}'.")
          print(f"Preflight passed: board exists and all {len(app_rows)} application matrix entries map to available extensions.")
          PY
      - name: Create one release with selected profile title
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
          FILESYSTEM_INPUT: ${{ inputs.filesystem }}
          OS_GROUP_INPUT: ${{ inputs.os_group }}
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
          SERVER: ${{ inputs.server }}
          MINIMAL: ${{ inputs.minimal }}
          APPLICATIONS: ${{ inputs.applications }}
          HOME_ASSISTANT: ${{ inputs.home_assistant }}
          OPENMEDIAVAULT: ${{ inputs.openmediavault }}
          KALI: ${{ inputs.kali }}
          DOCKER_CE: ${{ inputs.docker_ce }}
          DESKTOP: ${{ inputs.desktop }}
          DESKTOP_XFCE: ${{ inputs.desktop_xfce }}
          DESKTOP_MATE: ${{ inputs.desktop_mate }}
          DESKTOP_GNOME: ${{ inputs.desktop_gnome }}
          DESKTOP_CINNAMON: ${{ inputs.desktop_cinnamon }}
          DESKTOP_KDE_PLASMA: ${{ inputs.desktop_kde_plasma }}
          DESKTOP_I3_WM: ${{ inputs.desktop_i3_wm }}
          DESKTOP_ENLIGHTENMENT: ${{ inputs.desktop_enlightenment }}
          DESKTOP_BUDGIE: ${{ inputs.desktop_budgie }}
          DESKTOP_LXQT: ${{ inputs.desktop_lxqt }}
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(TZ=Asia/Jakarta date -d "$RUN_STARTED_AT" +'%Y-%m-%d_%H-%M')"
          tag="dbai-armbian-build-${RUN_ID}"

          # Derive the category from the actual matrix so the title reflects what will be built.
          mapfile -t profiles < <(python3 - <<'PY'
          import json, os
          matrix = json.loads(os.environ["MATRIX_JSON"])
          profiles = {row["profile"] for row in matrix.get("include", [])}
          for name in ["server", "minimal", "applications", "desktop"]:
              if name in profiles:
                  print(name)
          PY
          )
          if [[ "${#profiles[@]}" -eq 0 ]]; then
            echo "::error::No selected profile found in generated matrix."
            exit 1
          fi
          if [[ "${#profiles[@]}" -eq 4 ]]; then
            category_title="All"
          else
            category_title=""
            for profile in "${profiles[@]}"; do
              case "$profile" in
                server) display="Server" ;;
                minimal) display="Minimal" ;;
                applications) display="Applications" ;;
                desktop) display="Desktop" ;;
                *) echo "::error::Unknown profile: $profile"; exit 1 ;;
              esac
              if [[ -n "$category_title" ]]; then category_title+=" + "; fi
              category_title+="$display"
            done
          fi
          release_title="DBAI Armbian ${category_title} Build ${stamp}"
          notes_file="release-summary.md"
          {
            echo "# DBAI Armbian Build"
            echo
            echo "**Build started (Asia/Jakarta): ${stamp}**"
            echo
            echo '## Build selection'
            echo
            echo "- **OS release group:** ${OS_GROUP_INPUT}"
            echo "- **Filesystem target:** ${FILESYSTEM_INPUT}"
            echo "- **Selected profile groups:** ${category_title}"
            echo "- **Matrix jobs:** $(python3 -c 'import json,os; print(len(json.loads(os.environ["MATRIX_JSON"]).get("include", [])))')"
            echo "- **Image asset format:** `aml-s9xx-box-{filesystem}-{os-release}-{variant}.img.xz` (or `.img`)"
            if [[ "$SERVER" == "true" ]]; then echo '- **Profile:** Server on every selected OS release'; fi
            if [[ "$MINIMAL" == "true" ]]; then echo '- **Profile:** Minimal on every selected OS release'; fi
            if [[ "$APPLICATIONS" == "true" ]]; then
              echo '- **Profile:** all compatible Applications variants'
            else
              if [[ "$HOME_ASSISTANT" == "true" ]]; then echo '- **Application:** Home Assistant on supported releases'; fi
              if [[ "$OPENMEDIAVAULT" == "true" ]]; then echo '- **Application:** OpenMediaVault on supported releases'; fi
              if [[ "$KALI" == "true" ]]; then echo '- **Application:** Kali on Debian releases'; fi
              if [[ "$DOCKER_CE" == "true" ]]; then echo '- **Application:** Docker CE on supported Debian/Ubuntu releases'; fi
            fi
            if [[ "$DESKTOP" == "true" ]]; then
              echo '- **Profile:** all buildable Desktop environments on compatible selected OS releases'
            else
              if [[ "$DESKTOP_XFCE" == "true" ]]; then echo '- **Desktop:** XFCE on compatible selected OS releases'; fi
              if [[ "$DESKTOP_MATE" == "true" ]]; then echo '- **Desktop:** MATE on compatible selected OS releases'; fi
              if [[ "$DESKTOP_GNOME" == "true" ]]; then echo '- **Desktop:** GNOME on compatible selected OS releases'; fi
              if [[ "$DESKTOP_CINNAMON" == "true" ]]; then echo '- **Desktop:** Cinnamon on compatible selected OS releases'; fi
              if [[ "$DESKTOP_KDE_PLASMA" == "true" ]]; then echo '- **Desktop:** KDE Plasma on compatible selected OS releases'; fi
              if [[ "$DESKTOP_I3_WM" == "true" ]]; then echo '- **Desktop:** i3-wm on compatible selected OS releases'; fi
              if [[ "$DESKTOP_ENLIGHTENMENT" == "true" ]]; then echo '- **Desktop:** Enlightenment on compatible selected OS releases'; fi
              if [[ "$DESKTOP_BUDGIE" == "true" ]]; then echo '- **Desktop:** Budgie on compatible selected OS releases'; fi
              if [[ "$DESKTOP_LXQT" == "true" ]]; then echo '- **Desktop:** LXQt on compatible selected OS releases'; fi
            fi
            echo
            echo '## Application compatibility'
            echo
            echo '- Home Assistant and OpenMediaVault: Debian Bookworm/Trixie.'
            echo '- Kali: Debian Bookworm/Trixie/Forky only.'
            echo '- Docker CE: Debian Bookworm/Trixie and Ubuntu Jammy/Noble/Resolute.'
            echo '- Desktop group builds XFCE, MATE, GNOME, Cinnamon, KDE Plasma, i3-wm, Enlightenment, Budgie, and LXQt only where Armbian configng declares ARM64 availability for that release.'
            echo '- KDE Neon, Xmonad, and Deepin are skipped because current Armbian configng marks them unsupported or disabled.'
            echo
            echo '## Common image parameters'
            echo
            echo '- **Board:** `aml-s9xx-box`'
            echo '- **Kernel branch:** `current`'
            echo '- **Boot partition request:** 256 MiB'
            echo '- **Requested raw image size:** Server/Minimal 4096 MiB; Applications/Desktop 8192 MiB'
            echo '- **Image output:** compressed XZ when produced by Armbian Builder, with SHA-256 checksum'
            echo
            echo '## Integrity and availability'
            echo
            echo '- Only successful jobs upload image assets.'
            echo '- Each image has a `.manifest.txt` with board, filesystem, OS release, profile, variant, byte size, and SHA-256.'
            echo '- A consolidated `SHA256SUMS.txt` is finalized after all matrix jobs finish; per-image checksum sidecars are removed only after upload succeeds.'
            echo '- Requested raw image size is not the compressed download file size.'
            echo '- Failed build jobs are excluded from the consolidated checksum file.'
            echo
            echo "[Open GitHub Actions run](https://github.com/${GH_REPO}/actions/runs/${RUN_ID})"
          } > "$notes_file"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$release_title" --notes-file "$notes_file" --prerelease --latest=false
          else
            gh release create "$tag" --title "$release_title" --notes-file "$notes_file" --prerelease --latest=false
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_title=$release_title" >> "$GITHUB_OUTPUT"
          echo "Prepared release: $release_title ($tag)"
  build:
    if: inputs.cleanup_run_history != true
    needs: [prepare, create_release]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.filesystem }} / ${{ matrix.profile }} / ${{ matrix.variant }} / ${{ matrix.release }}
    steps:
      - name: Maximize available build disk
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout Armbian builder and local customizations
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # maximize-build-space gives the workspace a large dedicated volume, but
      # Docker normally stores layers under /var/lib/docker on the nearly-full root.
      # Move Docker's fresh data root onto the workspace volume before pulling/building.
      - name: Move Docker storage to large build volume
        shell: bash
        run: |
          set -euo pipefail
          docker_root="$GITHUB_WORKSPACE/.docker-data"
          echo "Docker data root will be: $docker_root"
          # Keep Docker's layers on the large workspace filesystem, but tell Git not to scan this root-owned data directory.
          exclude_file="$GITHUB_WORKSPACE/.git/info/exclude"
          grep -qxF '/.docker-data/' "$exclude_file" || printf '\n/.docker-data/\n' >> "$exclude_file"
          sudo systemctl stop docker.socket docker.service || true
          sudo mkdir -p "$docker_root"
          sudo chown root:root "$docker_root"
          sudo python3 - "$docker_root" <<'PY'
          import json, os, sys
          path = "/etc/docker/daemon.json"
          try:
              with open(path, encoding="utf-8") as f:
                  config = json.load(f)
          except FileNotFoundError:
              config = {}
          config["data-root"] = sys.argv[1]
          tmp = path + ".tmp"
          with open(tmp, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          os.replace(tmp, path)
          PY
          sudo systemctl start docker
          for i in {1..30}; do
            if docker info >/dev/null 2>&1; then break; fi
            sleep 2
          done
          actual_root="$(docker info --format '{{.DockerRootDir}}')"
          echo "DockerRootDir=$actual_root"
          [[ "$actual_root" == "$docker_root" ]] || {
            echo "::error::Docker did not switch to the large workspace volume."
            exit 1
          }
          echo "=== Filesystem containing Docker data root ==="
          df -h "$docker_root"
          df -h "$GITHUB_WORKSPACE"

      - name: Show runner specs and selected build configuration
        env:
          FS: ${{ matrix.filesystem }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
          RELEASE: ${{ matrix.release }}
          IMAGE_SIZE: ${{ matrix.image_size }}
          BUILD_DESKTOP: ${{ matrix.build_desktop }}
          BUILD_MINIMAL: ${{ matrix.build_minimal }}
          EXTENSION: ${{ matrix.extension }}
          DESKTOP_ENV: ${{ matrix.desktop_env }}
        run: |
          echo "========== DBAI ARMBIAN BUILD: PRE-BUILD REPORT =========="
          echo "=== Selected build ==="
          echo "Board: aml-s9xx-box"
          echo "Filesystem: $FS"
          echo "Profile / variant: $PROFILE / $VARIANT"
          echo "Release: $RELEASE"
          echo "Image size: ${IMAGE_SIZE} MiB"
          echo "BUILD_DESKTOP=$BUILD_DESKTOP"
          echo "BUILD_MINIMAL=$BUILD_MINIMAL"
          echo "Extension: ${EXTENSION:-none}"
          echo "Desktop environment: ${DESKTOP_ENV:-none}"
          echo "=== Runner OS ==="
          cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION_ID)=' || true
          uname -a
          echo "=== CPU ==="
          lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|CPU MHz|Thread|Core|Socket|Virtualization):' || true
          echo "=== RAM and swap ==="
          free -h
          swapon --show || true
          echo "=== Disk space ==="
          df -h /
          df -h "$GITHUB_WORKSPACE"
          df -ih /
          echo "=== Docker ==="
          docker --version
          docker info --format 'Docker root: {{.DockerRootDir}} | Storage driver: {{.Driver}}' || true
          docker system df || true
          echo "=========================================================="

      - name: Ensure custom extension directory exists
        shell: bash
        run: |
          mkdir -p userpatches/extensions
          touch userpatches/extensions/.gitkeep

      - name: Check custom board configuration
        run: |
          test -f config/boards/aml-s9xx-box.tvb || {
            echo "::error::config/boards/aml-s9xx-box.tvb is missing. Commit the custom board file to this repository."
            exit 1
          }
          echo "Custom board configuration found."
          if [[ -d userpatches ]]; then
            echo "userpatches directory found."
          else
            echo "No userpatches directory in checkout; continuing."
          fi

      - name: Check Btrfs support on runner
        if: matrix.filesystem == 'btrfs'
        run: |
          sudo modprobe btrfs || true
          if [[ ! -d /sys/module/btrfs ]]; then
            echo "::error::The GitHub runner kernel does not expose Btrfs support; cannot run ROOTFS_TYPE=btrfs on this runner."
            exit 1
          fi
          echo "Btrfs kernel support is available."

      # Register QEMU/binfmt on the runner host so Docker can execute ARM64
      # userspace while the x86_64 GitHub runner builds the ARM64 rootfs.
      - name: Enable ARM64 emulation with QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Verify ARM64 container emulation
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing ARM64 container execution before starting Armbian build..."
          result="$(docker run --rm --platform linux/arm64 alpine:3.20 uname -m)"
          echo "ARM64 container reported architecture: $result"
          [[ "$result" == "aarch64" || "$result" == "arm64" ]] || {
            echo "::error::QEMU/binfmt verification failed; expected aarch64/arm64, got: $result"
            exit 1
          }
          echo "ARM64 emulation is ready."

      - name: Build Armbian image
        env:
          FS: ${{ matrix.filesystem }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
          RELEASE: ${{ matrix.release }}
          IMAGE_SIZE: ${{ matrix.image_size }}
          BUILD_DESKTOP: ${{ matrix.build_desktop }}
          BUILD_MINIMAL: ${{ matrix.build_minimal }}
          EXTENSION: ${{ matrix.extension }}
          DESKTOP_ENV: ${{ matrix.desktop_env }}
        run: |
          set -o pipefail
          args=(
            "BOARD=aml-s9xx-box"
            "BOOTSIZE=256"
            "FIXED_IMAGE_SIZE=${IMAGE_SIZE}"
            "ROOTFS_TYPE=${FS}"
            "BRANCH=current"
            "BUILD_DESKTOP=${BUILD_DESKTOP}"
            "BUILD_MINIMAL=${BUILD_MINIMAL}"
            "COMPRESS_OUTPUTIMAGE=sha,xz"
            "IMAGE_XZ_COMPRESSION_RATIO=0"
            "KERNEL_GIT=shallow"
            "KERNEL_CONFIGURE=no"
          )
          if [[ -n "$EXTENSION" ]]; then
            args+=("ENABLE_EXTENSIONS=${EXTENSION}")
          fi
          if [[ "$PROFILE" == "desktop" ]]; then
            args+=("DESKTOP_ENVIRONMENT=${DESKTOP_ENV}" "DESKTOP_TIER=minimal")
          fi
          args+=("RELEASE=${RELEASE}")

          printf 'Running: ./compile.sh build'
          printf ' %q' "${args[@]}"
          printf '\n'

          ./compile.sh build "${args[@]}" 2>&1 | tee "build-${FS}-${PROFILE}-${VARIANT}-${RELEASE}.log"

      - name: Prepare image and checksum for release
        if: success()
        env:
          FS: ${{ matrix.filesystem }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
          RELEASE: ${{ matrix.release }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t images < <(find output/images -maxdepth 1 -type f \( -name '*.img.xz' -o -name '*.img' \) -print | sort)
          if [[ "${#images[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one image in output/images, found ${#images[@]}."
            printf '%s\n' "${images[@]}"
            find output/images -maxdepth 1 -type f -print || true
            exit 1
          fi
          image="${images[0]}"

          if [[ "$image" == *.img.xz ]]; then
            suffix="img.xz"
          else
            suffix="img"
          fi

          asset="aml-s9xx-box-${FS}-${RELEASE}-${VARIANT}.${suffix}"
          cp "$image" "dist/$asset"
          # The checksum must contain only the asset basename for portable verification.
          (cd dist && sha256sum "$asset" > "${asset}.sha256")
          ls -lh dist/

      - name: Upload image and checksum to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.create_release.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Remove local image files after successful upload
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- dist output/images
          echo "Local image files removed; Release assets remain available."

      - name: Show runner specs and remaining storage (AFTER BUILD)
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/dbai-after-build-report.txt"
          {
            echo "========== DBAI ARMBIAN BUILD: AFTER BUILD REPORT =========="
            date -Is
            echo "=== Runner OS ==="
            cat /etc/os-release | grep -E '^(PRETTY_NAME|VERSION_ID)=' || true
            uname -a
            echo "=== CPU ==="
            lscpu | grep -E '^(Architecture|CPU|Model name|CPU MHz|Thread|Core|Socket|Virtualization)' || true
            echo "=== RAM and swap ==="
            free -h
            swapon --show || true
            echo "=== Remaining disk space ==="
            df -h / || true
            df -h "$GITHUB_WORKSPACE" || true
            df -ih / || true
            echo "=== Docker storage ==="
            docker info --format 'Docker root: {{.DockerRootDir}} | Storage driver: {{.Driver}}' || true
            docker system df || true
            echo "=========================================================="
          } | tee "$report"

      - name: Upload build log as Actions artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ matrix.filesystem }}-${{ matrix.profile }}-${{ matrix.variant }}-${{ matrix.release }}
          path: |
            build-${{ matrix.filesystem }}-${{ matrix.profile }}-${{ matrix.variant }}-${{ matrix.release }}.log
            output/logs/*.log.ans
            ${{ runner.temp }}/dbai-after-build-report.txt
          if-no-files-found: ignore
          retention-days: 7

  finalize_release:
    needs: [create_release, build]
    if: always() && inputs.cleanup_run_history != true && needs.create_release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.create_release.outputs.release_tag }}
    steps:
      - name: Consolidate per-image checksums (supports reruns)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "::error::Release tag output is empty."
            exit 1
          fi

          asset_names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          mapfile -t checksum_assets < <(printf '%s\n' "$asset_names" | grep -E '\.img(\.xz)?\.sha256$' || true)

          mkdir -p checksum-input
          # Preserve a previous consolidated list when a failed job is rerun later.
          if gh release download "$RELEASE_TAG" --pattern 'SHA256SUMS.txt' --dir checksum-input; then
            mv checksum-input/SHA256SUMS.txt checksum-input/existing-SHA256SUMS.txt
          fi

          # Download current per-image sidecars if any. These take precedence over older sums.
          if [[ "${#checksum_assets[@]}" -gt 0 ]]; then
            gh release download "$RELEASE_TAG" --pattern '*.sha256' --dir checksum-input
          fi

          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path("checksum-input")
          checksums = {}
          digest_re = re.compile(r"^[0-9a-fA-F]{64}$")

          def read_sum_file(path):
              for line in path.read_text(encoding="utf-8").splitlines():
                  parts = line.strip().split(maxsplit=1)
                  if len(parts) != 2:
                      continue
                  digest, filename = parts
                  filename = filename.lstrip("*")
                  filename = pathlib.PurePosixPath(filename).name
                  if digest_re.fullmatch(digest) and filename:
                      checksums[filename] = digest.lower()

          existing = root / "existing-SHA256SUMS.txt"
          if existing.is_file():
              read_sum_file(existing)

          for sidecar in sorted(root.glob("*.sha256")):
              read_sum_file(sidecar)

          if not checksums:
              print("No successful image checksum assets exist; no SHA256SUMS.txt will be published.")
          else:
              with open("SHA256SUMS.txt", "w", encoding="utf-8", newline="\n") as output:
                  for filename in sorted(checksums):
                      output.write(f"{checksums[filename]}  {filename}\n")
              print(f"Prepared {len(checksums)} checksum entries.")
          PY

          if [[ ! -s SHA256SUMS.txt ]]; then
            echo "No checksum entries to publish; leaving the release unchanged."
            exit 0
          fi

          echo "Combined checksums:"
          cat SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber

          # Remove individual sidecars only after the combined file uploads successfully.
          for asset in "${checksum_assets[@]}"; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done
          echo "Published SHA256SUMS.txt; removed ${#checksum_assets[@]} current sidecars."

  cleanup_workflow_history:
    if: inputs.cleanup_run_history == true
    name: Delete workflow run history
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - name: Permanently delete repository workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIRMATION: ${{ inputs.confirm_run_history_cleanup }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "DELETE ALL RUN HISTORY" ]]; then
            echo "::error::Cleanup not authorized. Set confirmation to 'DELETE ALL RUN HISTORY'. No run was deleted."
            exit 1
          fi
          repo="$GITHUB_REPOSITORY"
          current="$CURRENT_RUN_ID"
          mapfile -t run_ids < <(gh api --paginate "repos/$repo/actions/runs?per_page=100" --jq '.workflow_runs[].id' | sort -un)
          echo "Found ${#run_ids[@]} workflow runs. Deleting all runs except the current cleanup run."
          deleted=0
          failed=0
          for run_id in "${run_ids[@]}"; do
            [[ -n "$run_id" ]] || continue
            [[ "$run_id" == "$current" ]] && continue
            if gh api --silent --method DELETE "repos/$repo/actions/runs/$run_id"; then
              deleted=$((deleted + 1))
              echo "Deleted workflow run $run_id"
            else
              failed=$((failed + 1))
              echo "::warning::Could not delete workflow run $run_id"
            fi
            sleep 0.2
          done
          echo "Deleted $deleted prior workflow runs; failures: $failed."
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Some workflow runs may remain."
            exit 1
          fi
          echo "Current cleanup run intentionally retained; GitHub may not permit a running workflow to delete itself."
