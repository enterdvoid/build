name: DBAI Armbian Build

on:
  workflow_dispatch:
    inputs:
      filesystem:
        description: "Filesystem target"
        required: true
        type: choice
        default: ext4
        options:
          - ext4
          - btrfs
          - both
      all_build_types:
        description: "Build semua tipe firmware (mengabaikan checkbox lainnya)"
        required: true
        type: boolean
        default: false
      server:
        description: "Server: semua 6 release"
        required: true
        type: boolean
        default: false
      minimal:
        description: "Minimal: semua 6 release"
        required: true
        type: boolean
        default: false
      home_assistant:
        description: "Applications: Home Assistant (Trixie)"
        required: true
        type: boolean
        default: false
      openmediavault:
        description: "Applications: OpenMediaVault (Trixie)"
        required: true
        type: boolean
        default: false
      kali:
        description: "Applications: Kali (Trixie)"
        required: true
        type: boolean
        default: false
      docker_ce:
        description: "Applications: Docker CE (Trixie)"
        required: true
        type: boolean
        default: false
      all_desktops:
        description: "Build semua 11 desktop environment (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_xfce:
        description: "Desktop: XFCE (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_mate:
        description: "Desktop: MATE (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_gnome:
        description: "Desktop: GNOME (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_cinnamon:
        description: "Desktop: Cinnamon (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_kde_plasma:
        description: "Desktop: KDE Plasma (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_kde_neon:
        description: "Desktop: KDE Neon (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_i3_wm:
        description: "Desktop: i3-wm (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_enlightenment:
        description: "Desktop: Enlightenment (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_xmonad:
        description: "Desktop: Xmonad (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_budgie:
        description: "Desktop: Budgie (Trixie)"
        required: true
        type: boolean
        default: false
      desktop_deepin:
        description: "Desktop: Deepin (Trixie)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dbai-armbian-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: matrix
        env:
          FILESYSTEM_INPUT: ${{ inputs.filesystem }}
          ALL_BUILD_TYPES: ${{ inputs.all_build_types }}
          SERVER: ${{ inputs.server }}
          MINIMAL: ${{ inputs.minimal }}
          HOME_ASSISTANT: ${{ inputs.home_assistant }}
          OPENMEDIAVAULT: ${{ inputs.openmediavault }}
          KALI: ${{ inputs.kali }}
          DOCKER_CE: ${{ inputs.docker_ce }}
          ALL_DESKTOPS: ${{ inputs.all_desktops }}
          DESKTOP_XFCE: ${{ inputs.desktop_xfce }}
          DESKTOP_MATE: ${{ inputs.desktop_mate }}
          DESKTOP_GNOME: ${{ inputs.desktop_gnome }}
          DESKTOP_CINNAMON: ${{ inputs.desktop_cinnamon }}
          DESKTOP_KDE_PLASMA: ${{ inputs.desktop_kde_plasma }}
          DESKTOP_KDE_NEON: ${{ inputs.desktop_kde_neon }}
          DESKTOP_I3_WM: ${{ inputs.desktop_i3_wm }}
          DESKTOP_ENLIGHTENMENT: ${{ inputs.desktop_enlightenment }}
          DESKTOP_XMONAD: ${{ inputs.desktop_xmonad }}
          DESKTOP_BUDGIE: ${{ inputs.desktop_budgie }}
          DESKTOP_DEEPIN: ${{ inputs.desktop_deepin }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          releases = ["bookworm", "trixie", "forky", "jammy", "noble", "resolute"]
          filesystems = ["ext4", "btrfs"] if os.environ["FILESYSTEM_INPUT"] == "both" else [os.environ["FILESYSTEM_INPUT"]]
          truthy = lambda name: os.environ.get(name, "false").lower() == "true"
          all_types = truthy("ALL_BUILD_TYPES")

          selected = {
              "server": all_types or truthy("SERVER"),
              "minimal": all_types or truthy("MINIMAL"),
          }
          app_variants = [
              ("home-assistant", "applications-ha", "HOME_ASSISTANT"),
              ("openmediavault", "applications-omv", "OPENMEDIAVAULT"),
              ("kali", "applications-kali", "KALI"),
              ("docker-ce", "docker-ce", "DOCKER_CE"),
          ]
          desktop_variants = [
              ("xfce", "DESKTOP_XFCE"), ("mate", "DESKTOP_MATE"),
              ("gnome", "DESKTOP_GNOME"), ("cinnamon", "DESKTOP_CINNAMON"),
              ("kde-plasma", "DESKTOP_KDE_PLASMA"), ("kde-neon", "DESKTOP_KDE_NEON"),
              ("i3-wm", "DESKTOP_I3_WM"), ("enlightenment", "DESKTOP_ENLIGHTENMENT"),
              ("xmonad", "DESKTOP_XMONAD"), ("budgie", "DESKTOP_BUDGIE"),
              ("deepin", "DESKTOP_DEEPIN"),
          ]
          selected_apps = [(v, e) for v, e, key in app_variants if all_types or truthy(key)]
          selected_desktops = [v for v, key in desktop_variants if all_types or truthy("ALL_DESKTOPS") or truthy(key)]

          matrix = []
          for fs in filesystems:
              for profile in ("server", "minimal"):
                  if not selected[profile]:
                      continue
                  for release in releases:
                      matrix.append({
                          "filesystem": fs, "profile": profile, "variant": profile,
                          "release": release, "image_size": 4096,
                          "build_desktop": "no", "build_minimal": "yes" if profile == "minimal" else "no",
                          "extension": "", "desktop_env": ""
                      })
              for variant, extension in selected_apps:
                  matrix.append({
                      "filesystem": fs, "profile": "applications", "variant": variant,
                      "release": "trixie", "image_size": 8192,
                      "build_desktop": "no", "build_minimal": "no",
                      "extension": extension, "desktop_env": ""
                  })
              for desktop in selected_desktops:
                  matrix.append({
                      "filesystem": fs, "profile": "desktop", "variant": desktop,
                      "release": "trixie", "image_size": 8192,
                      "build_desktop": "yes", "build_minimal": "no",
                      "extension": "", "desktop_env": desktop
                  })

          if not matrix:
              raise SystemExit("Tidak ada build yang dipilih. Centang minimal satu tipe build atau 'Build semua tipe firmware'.")
          print("matrix=" + json.dumps({"include": matrix}, separators=(",", ":")))
          print("count=" + str(len(matrix)))
          PY
      - name: Show selected matrix
        env:
          FILESYSTEM_INPUT: ${{ inputs.filesystem }}
          ALL_BUILD_TYPES: ${{ inputs.all_build_types }}
        run: |
          echo "Filesystem: $FILESYSTEM_INPUT"
          echo "Build all types: $ALL_BUILD_TYPES"
          echo "Build matrix generated."

  create_release:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          tag="dbai-armbian-build-${RUN_ID}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; reusing it."
          else
            gh release create "$tag" \
              --title "DBAI Armbian Build #${RUN_NUMBER}" \
              --notes "Automated DBAI Armbian build batch. Assets are named by filesystem, profile, variant, and release." \
              --prerelease \
              --latest=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, create_release]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.filesystem }} / ${{ matrix.profile }} / ${{ matrix.variant }} / ${{ matrix.release }}
    steps:
      - name: Maximize available build disk
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Show runner resources
        run: |
          echo "=== Disk ==="
          df -h /
          df -h "$GITHUB_WORKSPACE"
          echo "=== Memory ==="
          free -h
          echo "=== Docker ==="
          docker system df || true

      - name: Checkout Armbian builder and local customizations
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check custom board configuration
        run: |
          test -f config/boards/aml-s9xx-box.tvb || {
            echo "::error::config/boards/aml-s9xx-box.tvb is missing. Commit the custom board file to this repository."
            exit 1
          }
          echo "Custom board configuration found."
          if [[ -d userpatches ]]; then
            echo "userpatches directory found."
          else
            echo "No userpatches directory in checkout; continuing."
          fi

      - name: Check Btrfs support on runner
        if: matrix.filesystem == 'btrfs'
        run: |
          sudo modprobe btrfs || true
          if [[ ! -d /sys/module/btrfs ]]; then
            echo "::error::The GitHub runner kernel does not expose Btrfs support; cannot run ROOTFS_TYPE=btrfs on this runner."
            exit 1
          fi
          echo "Btrfs kernel support is available."

      - name: Build Armbian image
        env:
          FS: ${{ matrix.filesystem }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
          RELEASE: ${{ matrix.release }}
          IMAGE_SIZE: ${{ matrix.image_size }}
          BUILD_DESKTOP: ${{ matrix.build_desktop }}
          BUILD_MINIMAL: ${{ matrix.build_minimal }}
          EXTENSION: ${{ matrix.extension }}
          DESKTOP_ENV: ${{ matrix.desktop_env }}
        run: |
          set -o pipefail
          args=(
            "BOARD=aml-s9xx-box"
            "BOOTSIZE=256"
            "FIXED_IMAGE_SIZE=${IMAGE_SIZE}"
            "ROOTFS_TYPE=${FS}"
            "BRANCH=current"
            "BUILD_DESKTOP=${BUILD_DESKTOP}"
            "BUILD_MINIMAL=${BUILD_MINIMAL}"
            "COMPRESS_OUTPUTIMAGE=sha,xz"
            "IMAGE_XZ_COMPRESSION_RATIO=0"
            "KERNEL_GIT=shallow"
          )

          # Preserve the user's original options: KERNEL_CONFIGURE=no for
          # server, minimal, and application builds; desktop commands omit it.
          if [[ "$PROFILE" != "desktop" ]]; then
            args+=("KERNEL_CONFIGURE=no")
          fi
          if [[ -n "$EXTENSION" ]]; then
            args+=("ENABLE_EXTENSIONS=${EXTENSION}")
          fi
          if [[ "$PROFILE" == "desktop" ]]; then
            args+=("DESKTOP_ENVIRONMENT=${DESKTOP_ENV}" "DESKTOP_TIER=minimal")
          fi
          args+=("RELEASE=${RELEASE}")

          printf 'Running: ./compile.sh build'
          printf ' %q' "${args[@]}"
          printf '\n'

          ./compile.sh build "${args[@]}" 2>&1 | tee "build-${FS}-${PROFILE}-${VARIANT}-${RELEASE}.log"

      - name: Prepare image and checksum for release
        if: success()
        env:
          FS: ${{ matrix.filesystem }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
          RELEASE: ${{ matrix.release }}
        run: |
          set -euo pipefail
          mkdir -p dist
          image="$(find output/images -maxdepth 1 -type f \( -name '*.img.xz' -o -name '*.img' \) -print -quit)"
          if [[ -z "$image" ]]; then
            echo "::error::No .img.xz or .img file found in output/images."
            find output/images -maxdepth 1 -type f -print || true
            exit 1
          fi

          if [[ "$image" == *.img.xz ]]; then
            suffix="img.xz"
          else
            suffix="img"
          fi

          asset="aml-s9xx-box-${FS}-${RELEASE}-${PROFILE}-${VARIANT}.${suffix}"
          cp "$image" "dist/$asset"
          sha256sum "dist/$asset" > "dist/${asset}.sha256"
          ls -lh dist/

      - name: Upload image and checksum to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.create_release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Upload build log as Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.filesystem }}-${{ matrix.profile }}-${{ matrix.variant }}-${{ matrix.release }}
          path: |
            build-${{ matrix.filesystem }}-${{ matrix.profile }}-${{ matrix.variant }}-${{ matrix.release }}.log
            output/logs/*.log.ans
          if-no-files-found: ignore
          retention-days: 7
