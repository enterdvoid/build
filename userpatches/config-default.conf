# DBAI Armbian defaults.
# These defaults apply to builds on a PC and on GitHub Actions. CLI arguments
# can still override any setting.
#
# Keep a stable DBAI image version instead of Armbian's default *-trunk suffix.
# GitHub Actions and local builds use this embedded image version unless overridden.
REVISION="26.11.0"
IMAGE_VERSION="26.11.0"

VENDOR="DBAI"
VENDORPRETTYNAME="Armbian-DBAI-2K26"
ENABLE_EXTENSIONS="dbai-branding"
VENDORCOLOR="39;174;96"
VENDORURL="https://github.com/enterdvoid/build"
VENDORDOCS="https://github.com/enterdvoid/build#readme"
VENDORSUPPORT="https://github.com/enterdvoid/build/issues"
VENDORBUGS="https://github.com/enterdvoid/build/issues"
VENDORLOGO="armbian-logo"

MAINTAINER="DBAI Armbian Project"
MAINTAINERMAIL="noreply@github.com"
